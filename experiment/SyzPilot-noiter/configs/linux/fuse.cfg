{
    "kernel_subsystem": [
        {
            "name": "fuse",
            "path": [
                "fs/fuse"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "filter": {
                    "files": [
                        "^fs/fuse/"
                    ]
                },
