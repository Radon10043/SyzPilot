{
    "kernel_subsystem": [
        {
            "name": "fuse",
            "path": [
                "fs/fuse"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "filter": {
                    "files": [
                        "^fs/fuse/"
                    ]
                },
                "name": "fuse",
                "weight": 10
            }
        ]
    },
    "enable_syscalls": [
        "syz_mount_image$fuse",
        "syz_fuse_handle_req",
        "openat$fuse",
        "openat$cuse",
        "mount$fuse",
        "mount$fuseblk",
        "read$FUSE",
        "close",
        "openat$cuse_cuse_frontend_fops",
        "ioctl$CUSE_IOCTL_GET_COMMAND_cuse_frontend_fops",
        "write$cuse_cuse_frontend_fops",
        "read$cuse_cuse_frontend_fops",
        "ioctl$CUSE_INIT_cuse_frontend_fops",
        "openat$fuse_fuse_dev_operations",
        "syz_fuse_handle_req$fuse_dev_operations",
        "read$fuse_fuse_dev_operations",
        "write$fuse_fuse_dev_operations",
        "poll$fuse_fuse_dev_operations",
        "ioctl$FUSE_DEV_IOC_CLONE_fuse_dev_operations",
        "syz_mount_image$fuse_fuse_dir_operations",
        "openat$fuse_dir_fuse_dir_operations",
        "getdents$fuse_dir_fuse_dir_operations",
        "lseek$fuse_dir_fuse_dir_operations",
        "fsync$fuse_dir_fuse_dir_operations",
        "syz_fuse_handle_req$fuse_dir_operations",
        "write$fuse_fuse_dir_operations",
        "read$fuse_fuse_dir_operations",
        "syz_fuse_handle_req$fuse_file_operations",
        "open$fuse_fuse_file_operations",
        "splice$fuse_write_fuse_file_operations",
        "fsync$fuse_fuse_file_operations",
        "openat$fuse_fuse_file_operations",
        "copy_file_range$fuse_fuse_file_operations",
        "poll$fuse_fuse_file_operations",
        "write$fuse_fuse_file_operations",
        "flock$fuse_fuse_file_operations",
        "read$fuse_fuse_file_operations",
        "splice$fuse_read_fuse_file_operations",
        "close$fuse_fuse_file_operations",
        "fallocate$fuse_fuse_file_operations",
        "lseek$fuse_fuse_file_operations"
    ]
}
