{
    "kernel_subsystem": [
        {
            "name": "sequencer",
            "path": [
                "sound/core/seq"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "filter": {
                    "files": [
                        "^sound/core/seq/"
                    ]
                },
                "name": "sequencer",
                "weight": 10
            }
        ]
    },
    "enable_syscalls": [
        "openat$sndseq",
        "write$sndseq",
        "read",
        "close",
        "poll",
        "syz_open_dev$sequencer_seq_oss_f_ops",
        "ioctl$SNDCTL_MIDI_INFO_seq_oss_f_ops",
        "ioctl$SNDCTL_SEQ_CTRLRATE_seq_oss_f_ops",
        "ioctl$SNDCTL_SEQ_NRMIDIS_seq_oss_f_ops",
        "ioctl$SNDCTL_SEQ_SYNC_seq_oss_f_ops",
        "ioctl$SNDCTL_SYNTH_CONTROL_seq_oss_f_ops",
        "ioctl$SNDCTL_SYNTH_ID_seq_oss_f_ops",
        "ioctl$SNDCTL_SEQ_RESET_seq_oss_f_ops",
        "read$sequencer_seq_oss_f_ops",
        "ioctl$SNDCTL_SEQ_OUTOFBAND_seq_oss_f_ops",
        "ioctl$SNDCTL_SEQ_THRESHOLD_seq_oss_f_ops",
        "ioctl$SNDCTL_SEQ_PANIC_seq_oss_f_ops",
        "poll$sequencer_seq_oss_f_ops",
        "ioctl$SNDCTL_SEQ_PERCMODE_seq_oss_f_ops",
        "write$sequencer_seq_oss_f_ops",
        "ioctl$SNDCTL_SYNTH_MEMAVL_seq_oss_f_ops",
        "ioctl$SNDCTL_SEQ_NRSYNTHS_seq_oss_f_ops",
        "ioctl$SNDCTL_SYNTH_INFO_seq_oss_f_ops",
        "ioctl$SNDCTL_SEQ_GETINCOUNT_seq_oss_f_ops",
        "ioctl$SNDCTL_SEQ_RESETSAMPLES_seq_oss_f_ops",
        "ioctl$SNDCTL_SEQ_GETOUTCOUNT_seq_oss_f_ops",
        "ioctl$SNDCTL_SEQ_GETTIME_seq_oss_f_ops",
        "ioctl$SNDCTL_SEQ_TESTMIDI_seq_oss_f_ops",
        "poll$sndseq_snd_seq_f_ops",
        "read$sndseq_snd_seq_f_ops"
    ]
}
