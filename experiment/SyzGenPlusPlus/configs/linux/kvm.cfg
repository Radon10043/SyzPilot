{
    "kernel_subsystem": [
        { "name": "kvm", "path": ["arch/x86/kvm", "virt/kvm"] }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "kvm",
                "filter": { "files": ["^arch/x86/kvm/", "^virt/kvm/"] },
                "weight": 10.0
            }
        ]
