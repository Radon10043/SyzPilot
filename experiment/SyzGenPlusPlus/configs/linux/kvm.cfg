        "mmap",
        "munmap",
        "syz_kvm_setup_cpu$x86",
        "syz_kvm_setup_syzos_vm$x86",
        "syz_kvm_add_vcpu$x86",
        "syz_kvm_assert_syzos_uexit$x86",
        "syz_kvm_assert_syzos_kvm_exit$x86",
