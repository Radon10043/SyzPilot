{
    "kernel_subsystem": [
        { "name": "autofs", "path": ["fs/autofs"] }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "autofs",
                "filter": { "files": ["^fs/autofs/"] },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "openat$autofs_syzgen",
        "ioctl$autofs_Group0_0",
        "close",
        "mmap", "munmap"
    ]
}
