{
    "kernel_subsystem": [
        { "name": "sg", "path": ["drivers/scsi/sg.c"] }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "sg",
                "filter": { "files": ["^drivers/scsi/sg\\."] },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "openat$sg0_syzgen",
        "read$sg0_syzgen",
        "ioctl$sg0_Group0_0",
        "write$sg0_Group0_0",
        "read", "write", "close",
        "mmap", "munmap", "poll"
    ]
}
