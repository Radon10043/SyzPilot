{
    "kernel_subsystem": [
        { "name": "ptp", "path": ["drivers/ptp"] }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "ptp",
                "filter": { "files": ["^drivers/ptp/"] },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "openat$ptp0_syzgen",
        "read$ptp0_syzgen",
        "ioctl$ptp0_Group0_0",
        "close"
    ]
}
