{
    "kernel_subsystem": [
        { "name": "ppp", "path": ["drivers/net/ppp"] }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "ppp",
                "filter": { "files": ["^drivers/net/ppp/"] },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "openat$ppp_syzgen",
        "read$ppp_syzgen",
        "ioctl$ppp_Group0_0",
        "write$ppp_Group0_0_syzgen",
        "close",
        "socket$pppoe",
        "socket$pppl2tp",
        "socket$pptp",
        "connect$pppoe",
        "connect$pppl2tp",
        "setsockopt$pppl2tp_*",
        "read"
    ]
}
