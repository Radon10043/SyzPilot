{
    "kernel_subsystem": [
        { "name": "fuse", "path": ["fs/fuse"] }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "fuse",
                "filter": { "files": ["^fs/fuse/"] },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "openat$fuse_syzgen",
        "ioctl$fuse_Groupe503_0",
        "ioctl$fuse_Group4004e502_0",
        "ioctl$fuse_Group4010e501_0",
        "ioctl$fuse_Group8004e500_0",
        "close",
        "syz_mount_image$fuse",
        "syz_fuse_handle_req",
        "mount$fuse",
        "mount$fuseblk",
        "read$FUSE",
        "write$FUSE_*"
    ]
}
