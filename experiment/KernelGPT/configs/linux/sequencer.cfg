{
    "kernel_subsystem": [
        { "name": "sequencer", "path": ["sound/core/seq"] }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "sequencer",
                "filter": { "files": ["^sound/core/seq/"] },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "openat$sndseq",
        "write$sndseq",
        "ioctl$SNDRV_SEQ_IOCTL_PVERSION",
        "ioctl$SNDRV_SEQ_IOCTL_CLIENT_ID",
        "ioctl$SNDRV_SEQ_IOCTL_SYSTEM_INFO",
        "ioctl$SNDRV_SEQ_IOCTL_RUNNING_MODE",
        "ioctl$SNDRV_SEQ_IOCTL_GET_CLIENT_INFO", "ioctl$SNDRV_SEQ_IOCTL_SET_CLIENT_INFO",
        "ioctl$SNDRV_SEQ_IOCTL_CREATE_PORT", "ioctl$SNDRV_SEQ_IOCTL_DELETE_PORT",
        "ioctl$SNDRV_SEQ_IOCTL_GET_PORT_INFO", "ioctl$SNDRV_SEQ_IOCTL_SET_PORT_INFO",
        "ioctl$SNDRV_SEQ_IOCTL_SUBSCRIBE_PORT", "ioctl$SNDRV_SEQ_IOCTL_UNSUBSCRIBE_PORT",
        "ioctl$SNDRV_SEQ_IOCTL_CREATE_QUEUE", "ioctl$SNDRV_SEQ_IOCTL_DELETE_QUEUE",
        "ioctl$SNDRV_SEQ_IOCTL_GET_QUEUE_INFO", "ioctl$SNDRV_SEQ_IOCTL_SET_QUEUE_INFO",
        "ioctl$SNDRV_SEQ_IOCTL_GET_NAMED_QUEUE",
        "ioctl$SNDRV_SEQ_IOCTL_GET_QUEUE_STATUS",
        "ioctl$SNDRV_SEQ_IOCTL_GET_QUEUE_TEMPO", "ioctl$SNDRV_SEQ_IOCTL_SET_QUEUE_TEMPO",
        "ioctl$SNDRV_SEQ_IOCTL_GET_QUEUE_TIMER", "ioctl$SNDRV_SEQ_IOCTL_SET_QUEUE_TIMER",
        "ioctl$SNDRV_SEQ_IOCTL_GET_QUEUE_CLIENT", "ioctl$SNDRV_SEQ_IOCTL_SET_QUEUE_CLIENT",
        "ioctl$SNDRV_SEQ_IOCTL_GET_CLIENT_POOL", "ioctl$SNDRV_SEQ_IOCTL_SET_CLIENT_POOL",
        "ioctl$SNDRV_SEQ_IOCTL_REMOVE_EVENTS",
        "ioctl$SNDRV_SEQ_IOCTL_QUERY_SUBS", "ioctl$SNDRV_SEQ_IOCTL_GET_SUBSCRIPTION",
        "ioctl$SNDRV_SEQ_IOCTL_QUERY_NEXT_CLIENT", "ioctl$SNDRV_SEQ_IOCTL_QUERY_NEXT_PORT",
        "read", "close", "poll",
        "openat$KGPT_seq",
        "ioctl$KGPT_SNDRV_SEQ_IOCTL_GET_CLIENT_UMP_INFO",
        "ioctl$KGPT_SNDRV_SEQ_IOCTL_SET_CLIENT_UMP_INFO"
    ]
}
