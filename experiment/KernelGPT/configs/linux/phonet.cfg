{
    "kernel_subsystem": [
        {
            "name": "phonet",
            "path": [
                "net/phonet"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "phonet",
                "filter": {
                    "files": [
                        "^net/phonet/"
                    ]
                },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "listen",
        "ioctl$SIOCPNDELRESOURCE",
        "ioctl$SIOCPNENABLEPIPE",
        "ioctl$SIOCPNGETOBJECT",
        "setsockopt$PNPIPE_ENCAP",
        "getsockopt$PNPIPE_ENCAP",
        "setsockopt$PNPIPE_HANDLE",
        "getsockopt$PNPIPE_HANDLE",
        "setsockopt$PNPIPE_INITSTATE",
        "getsockopt$PNPIPE_INITSTATE",
        "getsockopt$PNPIPE_IFINDEX",
        "read",
        "write",
        "close",
        "socket$KGPT_phonet",
        "socket$KGPT_phonet_dup",
        "bind$KGPT_phonet_dgram_ops",
        "connect$KGPT_phonet_dgram_ops",
        "accept4$KGPT_phonet_dgram_ops",
        "sendto$KGPT_phonet_dgram_ops",
        "recvfrom$KGPT_phonet_dgram_ops",
        "bind$KGPT_phonet_stream_ops",
        "connect$KGPT_phonet_stream_ops",
        "accept4$KGPT_phonet_stream_ops",
        "sendto$KGPT_phonet_stream_ops",
        "recvfrom$KGPT_phonet_stream_ops",
        "ioctl$KGPT_SIOCPNADDRESOURCE_10",
        "ioctl$KGPT_SIOCPNADDRESOURCE_15"
    ]
}
