{
    "kernel_subsystem": [
        {
            "name": "input",
            "path": [
                "drivers/input"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "input",
                "filter": {
                    "files": [
                        "^drivers/input/"
                    ]
                },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "syz_open_dev$mouse",
        "openat$mice",
        "write$evdev",
        "write$uinput_user_dev",
        "write$input_event",
        "ioctl$EVIOC*",
        "ioctl$UI_*",
        "read",
        "close",
        "poll",
        "syz_open_dev$KGPT_evdev",
        "syz_open_dev$KGPT_serport",
        "ioctl$KGPT_SPIOCSTYPE",
        "openat$KGPT_uinput"
    ]
}
