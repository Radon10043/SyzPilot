{
    "kernel_subsystem": [
        {
            "name": "input",
            "path": [
                "drivers/input"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "input",
                "filter": {
                    "files": [
                        "^drivers/input/"
                    ]
                },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "syz_open_dev$mouse",
        "openat$mice",
        "write$evdev",
        "write$uinput_user_dev",
        "write$input_event",
        "ioctl$EVIOC*",
        "ioctl$UI_*",
        "read",
        "close",
        "poll",
        "ioctl$KGPT_EVIOCGVERSION_evdev_fops",
        "ioctl$KGPT_EVIOCGID_evdev_fops",
        "ioctl$KGPT_EVIOCGREP_evdev_fops",
        "ioctl$KGPT_EVIOCSREP_evdev_fops",
        "ioctl$KGPT_EVIOCRMFF_evdev_fops",
        "ioctl$KGPT_EVIOCGEFFECTS_evdev_fops",
        "ioctl$KGPT_EVIOCGRAB_evdev_fops",
        "ioctl$KGPT_EVIOCREVOKE_evdev_fops",
        "ioctl$KGPT_EVIOCGMASK_evdev_fops",
        "ioctl$KGPT_EVIOCSMASK_evdev_fops",
        "ioctl$KGPT_EVIOCSCLOCKID_evdev_fops",
        "ioctl$KGPT_EVIOCGKEYCODE_evdev_fops",
        "ioctl$KGPT_EVIOCSKEYCODE_evdev_fops",
        "ioctl$KGPT_EVIOCGKEYCODE_V2_evdev_fops",
        "ioctl$KGPT_EVIOCSKEYCODE_V2_evdev_fops",
        "openat$KGPT_uinput_uinput_fops",
        "ioctl$KGPT_UI_DEV_CREATE_uinput_fops",
        "ioctl$KGPT_UI_DEV_DESTROY_uinput_fops",
        "ioctl$KGPT_UI_GET_VERSION_uinput_fops",
        "ioctl$KGPT_UI_DEV_SETUP_uinput_fops",
        "ioctl$KGPT_UI_SET_EVBIT_uinput_fops",
        "ioctl$KGPT_UI_SET_KEYBIT_uinput_fops",
        "ioctl$KGPT_UI_SET_RELBIT_uinput_fops",
        "ioctl$KGPT_UI_SET_ABSBIT_uinput_fops",
        "ioctl$KGPT_UI_SET_MSCBIT_uinput_fops",
        "ioctl$KGPT_UI_SET_LEDBIT_uinput_fops",
        "ioctl$KGPT_UI_SET_FFBIT_uinput_fops",
        "ioctl$KGPT_UI_SET_SWBIT_uinput_fops",
        "ioctl$KGPT_UI_SET_PROPBIT_uinput_fops",
        "ioctl$KGPT_UI_SET_PHYS_uinput_fops",
        "ioctl$KGPT_UI_BEGIN_FF_UPLOAD_uinput_fops",
        "ioctl$KGPT_UI_BEGIN_FF_ERASE_uinput_fops",
        "ioctl$KGPT_UI_END_FF_UPLOAD_uinput_fops",
        "ioctl$KGPT_UI_END_FF_ERASE_uinput_fops",
        "ioctl$KGPT_UI_ABS_SETUP_uinput_fops",
        "ioctl$KGPT_SPIOCSTYPE_serport_ldisc"
    ]
}
