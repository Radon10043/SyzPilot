{
    "kernel_subsystem": [
        {
            "name": "fuse",
            "path": [
                "fs/fuse"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "fuse",
                "filter": {
                    "files": [
                        "^fs/fuse/"
                    ]
                },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "syz_mount_image$fuse",
        "syz_fuse_handle_req",
        "openat$fuse",
        "openat$cuse",
        "mount$fuse",
        "mount$fuseblk",
        "read$FUSE",
        "close",
        "openat$KGPT_fuse_fuse_dev_operations",
        "ioctl$KGPT_FUSE_DEV_IOC_SYNC_INIT_fuse_dev_operations",
        "ioctl$KGPT_FUSE_DEV_IOC_CLONE_fuse_dev_operations",
        "ioctl$KGPT_FUSE_DEV_IOC_BACKING_OPEN_fuse_dev_operations",
        "ioctl$KGPT_FUSE_DEV_IOC_BACKING_CLOSE_fuse_dev_operations",
        "openat$KGPT_fuse_dup_fuse_dir_operations",
        "ioctl$KGPT_FS_IOC_MEASURE_VERITY_fuse_dir_operations",
        "ioctl$KGPT_FS_IOC_ENABLE_VERITY_fuse_dir_operations",
        "openat$KGPT_fuse_dup_dup_fuse_file_operations",
        "ioctl$KGPT_FS_IOC_MEASURE_VERITY_0_fuse_file_operations",
        "ioctl$KGPT_FS_IOC_ENABLE_VERITY_0_fuse_file_operations"
    ]
}