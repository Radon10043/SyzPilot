{
    "kernel_subsystem": [
        {
            "name": "i2c",
            "path": [
                "drivers/i2c"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "i2c",
                "filter": {
                    "files": [
                        "^drivers/i2c/"
                    ]
                },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "syz_open_dev$I2C",
        "ioctl$I2C_*",
        "read",
        "write",
        "close",
        "ioctl$KGPT_I2C_SLAVE_i2cdev_fops",
        "ioctl$KGPT_I2C_SLAVE_FORCE_i2cdev_fops",
        "ioctl$KGPT_I2C_TENBIT_i2cdev_fops",
        "ioctl$KGPT_I2C_PEC_i2cdev_fops",
        "ioctl$KGPT_I2C_FUNCS_i2cdev_fops",
        "ioctl$KGPT_I2C_RDWR_i2cdev_fops",
        "ioctl$KGPT_I2C_SMBUS_i2cdev_fops",
        "ioctl$KGPT_I2C_RETRIES_i2cdev_fops",
        "ioctl$KGPT_I2C_TIMEOUT_i2cdev_fops"
    ]
}
