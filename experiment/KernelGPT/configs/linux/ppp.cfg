{
    "kernel_subsystem": [
        { "name": "ppp", "path": ["drivers/net/ppp"] }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "ppp",
                "filter": { "files": ["^drivers/net/ppp/"] },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "openat$ppp",
        "write$ppp",
        "ioctl$PPPIOC*",
        "socket$pppoe", "socket$pppl2tp", "socket$pptp",
        "connect$pppoe", "connect$pppl2tp",
        "ioctl$PPPOEIOCSFWD", "ioctl$PPPOEIOCDFWD",
        "ioctl$PPPIOCGL2TPSTATS",
        "setsockopt$pppl2tp_*",
        "ioctl$PPPIOCSFLAGS", "ioctl$PPPIOCGFLAGS",
        "ioctl$PPPIOCSMRU", "ioctl$PPPIOCGMRU",
        "ioctl$PPPIOCGCHAN",
        "read", "close",
        "syz_open_dev$KGPT_ppp_async",
        "syz_open_dev$KGPT_ppp",
        "openat$KGPT_ppp",
        "ioctl$KGPT_PPPIOCGASYNCMAP",
        "ioctl$KGPT_PPPIOCGASYNCMAP_0",
        "ioctl$KGPT_PPPIOCSASYNCMAP",
        "ioctl$KGPT_PPPIOCSASYNCMAP_0",
        "ioctl$KGPT_PPPIOCGRASYNCMAP",
        "ioctl$KGPT_PPPIOCGRASYNCMAP_0",
        "ioctl$KGPT_PPPIOCSRASYNCMAP",
        "ioctl$KGPT_PPPIOCSRASYNCMAP_0",
        "ioctl$KGPT_PPPIOCGXASYNCMAP",
        "ioctl$KGPT_PPPIOCGXASYNCMAP_0",
        "ioctl$KGPT_PPPIOCSXASYNCMAP",
        "ioctl$KGPT_PPPIOCSXASYNCMAP_0",
        "socket$KGPT_pppol2tp",
        "bind$KGPT_pppol2tp_ops",
        "connect$KGPT_pppol2tp_ops",
        "accept4$KGPT_pppol2tp_ops",
        "sendto$KGPT_pppol2tp_ops",
        "recvfrom$KGPT_pppol2tp_ops",
        "getsockopt$KGPT_PPPOL2TP_SO_DEBUG",
        "getsockopt$KGPT_PPPOL2TP_SO_RECVSEQ",
        "getsockopt$KGPT_PPPOL2TP_SO_SENDSEQ",
        "getsockopt$KGPT_PPPOL2TP_SO_LNSMODE",
        "getsockopt$KGPT_PPPOL2TP_SO_REORDERTO",
        "setsockopt$KGPT_PPPOL2TP_SO_RECVSEQ",
        "setsockopt$KGPT_PPPOL2TP_SO_SENDSEQ",
        "setsockopt$KGPT_PPPOL2TP_SO_LNSMODE",
        "setsockopt$KGPT_PPPOL2TP_SO_REORDERTO"
    ]
}
