{
    "kernel_subsystem": [
        {
            "name": "autofs",
            "path": [
                "fs/autofs"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "autofs",
                "filter": {
                    "files": [
                        "^fs/autofs/"
                    ]
                },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "mount",
        "open",
        "openat",
        "close",
        "read",
        "write",
        "stat",
        "lstat",
        "fstat",
        "mkdir",
        "mkdirat",
        "rmdir",
        "symlink",
        "symlinkat",
        "readlink",
        "readlinkat",
        "unlink",
        "unlinkat",
        "rename",
        "renameat",
        "renameat2",
        "getdents64",
        "openat$KGPT_autofs_dev_ioctl__dev_ioctl_fops",
        "ioctl$KGPT_AUTOFS_DEV_IOCTL_VERSION_CMD__dev_ioctl_fops",
        "ioctl$KGPT_AUTOFS_DEV_IOCTL_PROTOVER_CMD__dev_ioctl_fops",
        "ioctl$KGPT_AUTOFS_DEV_IOCTL_PROTOSUBVER_CMD__dev_ioctl_fops",
        "ioctl$KGPT_AUTOFS_DEV_IOCTL_OPENMOUNT_CMD__dev_ioctl_fops",
        "ioctl$KGPT_AUTOFS_DEV_IOCTL_CLOSEMOUNT_CMD__dev_ioctl_fops",
        "ioctl$KGPT_AUTOFS_DEV_IOCTL_READY_CMD__dev_ioctl_fops",
        "ioctl$KGPT_AUTOFS_DEV_IOCTL_FAIL_CMD__dev_ioctl_fops",
        "ioctl$KGPT_AUTOFS_DEV_IOCTL_SETPIPEFD_CMD__dev_ioctl_fops",
        "ioctl$KGPT_AUTOFS_DEV_IOCTL_CATATONIC_CMD__dev_ioctl_fops",
        "ioctl$KGPT_AUTOFS_DEV_IOCTL_TIMEOUT_CMD__dev_ioctl_fops",
        "ioctl$KGPT_AUTOFS_DEV_IOCTL_REQUESTER_CMD__dev_ioctl_fops",
        "ioctl$KGPT_AUTOFS_DEV_IOCTL_EXPIRE_CMD__dev_ioctl_fops",
        "ioctl$KGPT_AUTOFS_DEV_IOCTL_ASKUMOUNT_CMD__dev_ioctl_fops",
        "ioctl$KGPT_AUTOFS_DEV_IOCTL_ISMOUNTPOINT_CMD__dev_ioctl_fops"
    ]
}
