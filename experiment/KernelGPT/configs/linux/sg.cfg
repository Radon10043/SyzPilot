{
    "kernel_subsystem": [
        {
            "name": "sg",
            "path": [
                "drivers/scsi/sg.c"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "sg",
                "filter": {
                    "files": [
                        "^drivers/scsi/sg\\."
                    ]
                },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "syz_open_dev$sg",
        "ioctl$SG_*",
        "ioctl$SCSI_IOCTL_*",
        "read", "write", "close",
        "mmap", "munmap", "poll",
        "syz_open_dev$KGPT_sg",
        "ioctl$KGPT_SG_GET_TRANSFORM",
        "ioctl$KGPT_SG_SET_FORCE_LOW_DMA"
    ]
}
