{
    "kernel_subsystem": [
        {
            "name": "sg",
            "path": [
                "drivers/scsi/sg.c"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "sg",
                "filter": {
                    "files": [
                        "^drivers/scsi/sg\\."
                    ]
                },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "syz_open_dev$KGPT_sg_sg_fops",
        "read",
        "write",
        "close",
        "mmap",
        "munmap",
        "poll",
        "ioctl$KGPT_SG*",
        "ioctl$KGPT_SCSI*"
    ]
}
