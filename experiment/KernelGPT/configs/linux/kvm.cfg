{
    "kernel_subsystem": [
        { "name": "kvm", "path": ["arch/x86/kvm", "virt/kvm"] }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "kvm",
                "filter": { "files": ["^arch/x86/kvm/", "^virt/kvm/"] },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "openat$kvm",
        "ioctl$KVM_*",
        "syz_kvm_setup_cpu$x86",
        "syz_kvm_setup_syzos_vm$x86",
        "syz_kvm_add_vcpu$x86",
        "syz_kvm_assert_syzos_uexit$x86",
        "syz_kvm_assert_syzos_kvm_exit$x86",
        "read", "write", "close",
        "mmap", "munmap",
        "openat$KGPT_vgpu",
        "ioctl$KGPT_VFIO_DEVICE_GET_INFO_0",
        "ioctl$KGPT_VFIO_DEVICE_GET_REGION_INFO_0",
        "ioctl$KGPT_VFIO_DEVICE_GET_IRQ_INFO_0",
        "ioctl$KGPT_VFIO_DEVICE_SET_IRQS_0",
        "ioctl$KGPT_VFIO_DEVICE_RESET_0",
        "ioctl$KGPT_VFIO_DEVICE_QUERY_GFX_PLANE",
        "ioctl$KGPT_VFIO_DEVICE_GET_GFX_DMABUF"
    ]
}
