{
    "kernel_subsystem": [
        {
            "name": "x25",
            "path": ["net/x25"]
        }
    ],
    "experimental": {
        "focus_areas": [
            {"name": "x25", "filter": {"files": ["^net/x25/"]}, "weight": 10.0}
        ]
    },
    "enable_syscalls": [
        "syz_init_net_socket$x25",
        "bind$x25", "connect$x25",
        "sendto$x25", "recvfrom$x25",
        "setsockopt$X25_QBITINCL", "getsockopt$X25_QBITINCL",
        "ioctl$sock_x25_SIOCADDRT", "ioctl$sock_x25_SIOCDELRT",
        "ioctl$SIOCX25*",
        "read", "write", "close",
        "socket$KGPT_X25",
        "bind$KGPT_x25_proto_ops",
        "connect$KGPT_x25_proto_ops",
        "accept4$KGPT_x25_proto_ops",
        "sendto$KGPT_x25_proto_ops",
        "recvfrom$KGPT_x25_proto_ops",
        "getsockopt$KGPT_X25_QBITINCL",
        "setsockopt$KGPT_X25_QBITINCL",
        "ioctl$KGPT_SIOCGIFMETRIC_1",
        "ioctl$KGPT_SIOCSIFMETRIC_1",
        "openat$KGPT_net_tun",
        "openat$KGPT_net_tun_dup",
        "openat$KGPT_net_tun_dup_dup",
        "openat$KGPT_net_tun_dup_dup_dup",
        "openat$KGPT_tap",
        "ioctl$KGPT_IF_GET_PROTO",
        "ioctl$KGPT_IF_GET_PROTO_0",
        "ioctl$KGPT_IF_GET_PROTO_1",
        "ioctl$KGPT_IF_GET_PROTO_2",
        "ioctl$KGPT_IF_GET_PROTO_3",
        "ioctl$KGPT_IF_PROTO_CISCO",
        "ioctl$KGPT_IF_PROTO_FR",
        "ioctl$KGPT_IF_PROTO_FR_ADD_PVC",
        "ioctl$KGPT_IF_PROTO_FR_DEL_PVC",
        "ioctl$KGPT_IF_PROTO_FR_ADD_ETH_PVC",
        "ioctl$KGPT_IF_PROTO_FR_DEL_ETH_PVC",
        "ioctl$KGPT_IF_PROTO_HDLC",
        "ioctl$KGPT_IF_PROTO_HDLC_ETH",
        "ioctl$KGPT_IF_PROTO_X25",
        "listen",
        "accept",
        "accept4"
    ]
}
