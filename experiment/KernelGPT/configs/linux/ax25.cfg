{
    "kernel_subsystem": [
        {
            "name": "ax25",
            "path": [
                "net/ax25",
                "net/netrom",
                "net/rose"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "ax25",
                "filter": {
                    "files": [
                        "^net/ax25/",
                        "^net/netrom/",
                        "^net/rose/"
                    ]
                },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "syz_init_net_socket$ax25",
        "bind$ax25",
        "connect$ax25",
        "accept$ax25",
        "accept4$ax25",
        "sendto$ax25",
        "recvfrom$ax25",
        "getsockname$ax25",
        "getpeername$ax25",
