{
    "kernel_subsystem": [
        {
            "name": "ptp",
            "path": [
                "drivers/ptp"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "ptp",
                "filter": {
                    "files": [
                        "^drivers/ptp/"
                    ]
                },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "openat$ptp0",
        "openat$ptp1",
        "ioctl$PTP_*",
        "close",
        "ioctl$KGPT_PTP_MASK_CLEAR_ALL_ptp_clock_ops",
        "ioctl$KGPT_PTP_CLOCK_GETCAPS_ptp_clock_ops",
        "ioctl$KGPT_PTP_CLOCK_GETCAPS2_ptp_clock_ops",
        "ioctl$KGPT_PTP_EXTTS_REQUEST_ptp_clock_ops",
        "ioctl$KGPT_PTP_EXTTS_REQUEST2_ptp_clock_ops",
        "ioctl$KGPT_PTP_PEROUT_REQUEST_ptp_clock_ops",
        "ioctl$KGPT_PTP_PEROUT_REQUEST2_ptp_clock_ops",
        "ioctl$KGPT_PTP_ENABLE_PPS_ptp_clock_ops",
        "ioctl$KGPT_PTP_ENABLE_PPS2_ptp_clock_ops",
        "ioctl$KGPT_PTP_SYS_OFFSET_PRECISE_ptp_clock_ops",
        "ioctl$KGPT_PTP_SYS_OFFSET_PRECISE2_ptp_clock_ops",
        "ioctl$KGPT_PTP_SYS_OFFSET_EXTENDED_ptp_clock_ops",
        "ioctl$KGPT_PTP_SYS_OFFSET_EXTENDED2_ptp_clock_ops",
        "ioctl$KGPT_PTP_SYS_OFFSET_ptp_clock_ops",
        "ioctl$KGPT_PTP_SYS_OFFSET2_ptp_clock_ops",
        "ioctl$KGPT_PTP_PIN_GETFUNC_ptp_clock_ops",
        "ioctl$KGPT_PTP_PIN_GETFUNC2_ptp_clock_ops",
        "ioctl$KGPT_PTP_PIN_SETFUNC_ptp_clock_ops",
        "ioctl$KGPT_PTP_PIN_SETFUNC2_ptp_clock_ops",
        "ioctl$KGPT_PTP_MASK_EN_SINGLE_ptp_clock_ops",
        "ioctl$KGPT_PTP_SYS_OFFSET_PRECISE_CYCLES_ptp_clock_ops",
        "ioctl$KGPT_PTP_SYS_OFFSET_EXTENDED_CYCLES_ptp_clock_ops"
    ]
}
