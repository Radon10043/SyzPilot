{
    "kernel_subsystem": [
        {
            "name": "ptp",
            "path": [
                "drivers/ptp"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "ptp",
                "filter": {
                    "files": [
                        "^drivers/ptp/"
                    ]
                },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "read$ptp",
        "ioctl$PTP_CLOCK_GETCAPS",
        "ioctl$PTP_EXTTS_REQUEST",
        "ioctl$PTP_EXTTS_REQUEST2",
        "ioctl$PTP_PEROUT_REQUEST",
        "ioctl$PTP_PEROUT_REQUEST2",
        "ioctl$PTP_ENABLE_PPS",
        "ioctl$PTP_SYS_OFFSET",
        "ioctl$PTP_SYS_OFFSET_PRECISE",
        "ioctl$PTP_SYS_OFFSET_EXTENDED",
        "ioctl$PTP_PIN_GETFUNC",
        "ioctl$PTP_PIN_GETFUNC2",
        "ioctl$PTP_PIN_SETFUNC",
        "ioctl$PTP_PIN_SETFUNC2",
        "close",
        "syz_open_dev$KGPT_ptp",
        "ioctl$KGPT_PTP_MASK_CLEAR_ALL",
        "ioctl$KGPT_PTP_MASK_EN_SINGLE",
        "ioctl$KGPT_PTP_CLOCK_GETCAPS2",
        "ioctl$KGPT_PTP_ENABLE_PPS2",
        "ioctl$KGPT_PTP_SYS_OFFSET2",
        "ioctl$KGPT_PTP_SYS_OFFSET_PRECISE2",
        "ioctl$KGPT_PTP_SYS_OFFSET_EXTENDED2"
    ]
}
