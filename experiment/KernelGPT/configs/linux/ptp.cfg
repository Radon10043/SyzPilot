{
    "kernel_subsystem": [
        {
            "name": "ptp",
            "path": [
                "drivers/ptp"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "ptp",
                "filter": {
                    "files": [
                        "^drivers/ptp/"
                    ]
                },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "openat$ptp0",
        "openat$ptp1",
        "ioctl$PTP_*",
        "close",
        "syz_open_dev$KGPT_ptp",
        "ioctl$KGPT_PTP_MASK_CLEAR_ALL",
        "ioctl$KGPT_PTP_MASK_EN_SINGLE",
        "ioctl$KGPT_PTP_CLOCK_GETCAPS2",
        "ioctl$KGPT_PTP_ENABLE_PPS2",
        "ioctl$KGPT_PTP_SYS_OFFSET2",
        "ioctl$KGPT_PTP_SYS_OFFSET_PRECISE2",
        "ioctl$KGPT_PTP_SYS_OFFSET_EXTENDED2"
    ]
}
