{
    "kernel_subsystem": [
        {
            "name": "comedi",
            "path": [
                "drivers/comedi"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "filter": {
                    "files": [
                        "^drivers/comedi/"
                    ]
                },
                "name": "comedi",
                "weight": 10
            }
        ]
    },
    "enable_syscalls": [
        "openat$comedi",
        "read",
        "write",
        "close",
        "mmap",
        "munmap",
        "read$comedi",
        "write$comedi",
        "poll$comedi",
        "mmap$comedi",
        "lseek$comedi",
        "ioctl$COMEDI_DEVCONFIG",
        "ioctl$COMEDI_DEVINFO",
        "ioctl$COMEDI_SUBDINFO",
        "ioctl$COMEDI_CHANINFO",
        "ioctl$COMEDI_BUFCONFIG",
        "ioctl$COMEDI_BUFINFO",
        "ioctl$COMEDI_CMD",
        "ioctl$COMEDI_CMDTEST",
        "ioctl$COMEDI_INSNLIST",
        "ioctl$COMEDI_INSN",
        "ioctl$COMEDI_CANCEL",
        "ioctl$COMEDI_RANGEINFO"
    ]
}
