{
    "kernel_subsystem": [
        {
            "name": "sequencer",
            "path": [
                "sound/core/seq"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "filter": {
                    "files": [
                        "^sound/core/seq/"
                    ]
                },
                "name": "sequencer",
                "weight": 10
            }
        ]
    },
    "enable_syscalls": [
        "openat$sndseq",
        "write$sndseq",
        "read",
        "close",
