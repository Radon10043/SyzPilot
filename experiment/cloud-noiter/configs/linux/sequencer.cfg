        "write$seq_oss_seq_oss_f_ops",
        "ioctl$seq_oss_seq_oss_f_ops",
        "poll$seq_oss_seq_oss_f_ops",
        "lseek$seq_oss_seq_oss_f_ops",
        "openat$snd_seq_snd_seq_f_ops",
        "read$snd_seq_snd_seq_f_ops",
        "write$snd_seq_snd_seq_f_ops",
        "poll$snd_seq_snd_seq_f_ops",
        "ioctl$snd_seq_snd_seq_f_ops"
    ]
