{
    "kernel_subsystem": [
        {
            "name": "i2c",
            "path": [
                "drivers/i2c"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "filter": {
                    "files": [
                        "^drivers/i2c/"
                    ]
                },
                "name": "i2c",
                "weight": 10
            }
        ]
    },
    "enable_syscalls": [
        "syz_open_dev$I2C",
        "read",
        "write",
        "close",
        "syz_open_dev$__CODEX_i2c",
        "openat$__CODEX_i2c0",
        "ioctl$__CODEX_I2C_*"
    ]
}
