{
    "kernel_subsystem": [
        {
            "name": "fuse",
            "path": [
                "fs/fuse"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "filter": {
                    "files": [
                        "^fs/fuse/"
                    ]
                },
                "name": "fuse",
                "weight": 10
            }
        ]
    },
    "enable_syscalls": [
        "syz_mount_image$fuse",
        "syz_fuse_handle_req",
        "openat$fuse",
        "openat$cuse",
        "mount$fuse",
        "mount$fuseblk",
        "read$FUSE",
        "close",
        "syz_mount_image$__CODEX_fuse",
        "openat$__CODEX_fuse",
        "openat$__CODEX_cuse",
        "read$__CODEX_fuse",
        "write$__CODEX_fuse",
        "ioctl$__CODEX_FUSE_DEV_IOC_*"
    ]
}
