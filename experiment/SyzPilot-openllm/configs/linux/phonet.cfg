{
    "kernel_subsystem": [
        {
            "name": "phonet",
            "path": [
                "net/phonet"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "filter": {
                    "files": [
                        "^net/phonet/"
                    ]
                },
                "name": "phonet",
                "weight": 10
            }
        ]
    },
    "enable_syscalls": [
        "socket$phonet",
        "socket$phonet_pipe",
        "bind$phonet",
        "connect$phonet_pipe",
        "accept$phonet_pipe",
        "accept4$phonet_pipe",
        "sendto$phonet",
        "recvfrom$phonet",
        "listen",
        "ioctl$SIOCPNADDRESOURCE",
        "ioctl$SIOCPNDELRESOURCE",
        "ioctl$SIOCPNENABLEPIPE",
        "ioctl$SIOCPNGETOBJECT",
        "setsockopt$PNPIPE_ENCAP",
        "getsockopt$PNPIPE_ENCAP",
        "setsockopt$PNPIPE_HANDLE",
        "getsockopt$PNPIPE_HANDLE",
        "setsockopt$PNPIPE_INITSTATE",
        "getsockopt$PNPIPE_INITSTATE",
        "getsockopt$PNPIPE_IFINDEX",
        "read",
        "write",
        "close",
        "socket$pnpipe_pep_proto",
        "ioctl$SIOCINQ_pep_proto",
        "ioctl$SIOCPNENABLEPIPE_pep_proto",
        "socket$AF_PHONET_phonet_dgram_ops",
        "syz_open_dev$phonet_phonet_dgram_ops",
        "ioctl$SIOCPNADDRESOURCE_phonet_dgram_ops",
        "ioctl$SIOCPNDELRESOURCE_phonet_dgram_ops",
        "ioctl$SIOCPNENABLEPIPE_phonet_dgram_ops",
        "ioctl$SIOCPNGAUTOCONF_phonet_dgram_ops",
        "ioctl$SIOCPNGETOBJECT_phonet_dgram_ops",
        "socket$phonet_phonet_stream_ops",
        "openat$phonet_phonet_stream_ops",
        "ioctl$SIOCPNADDRESOURCE_phonet_stream_ops",
        "ioctl$SIOCPNDELRESOURCE_phonet_stream_ops",
        "ioctl$SIOCPNENABLEPIPE_phonet_stream_ops",
        "ioctl$SIOCPNGAUTOCONF_phonet_stream_ops",
        "ioctl$SIOCPNGETOBJECT_phonet_stream_ops",
        "socket$phonet_pn_proto",
        "ioctl$SIOCINQ_pn_proto",
        "ioctl$SIOCPNADDRESOURCE_pn_proto",
        "ioctl$SIOCPNDELRESOURCE_pn_proto",
        "ioctl$SIOCPNENABLEPIPE_pn_proto",
        "ioctl$SIOCPNGAUTOCONF_pn_proto",
        "ioctl$SIOCPNGETOBJECT_pn_proto"
    ]
}
