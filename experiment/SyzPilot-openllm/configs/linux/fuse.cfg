{
    "kernel_subsystem": [
        {
            "name": "fuse",
            "path": [
                "fs/fuse"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "filter": {
                    "files": [
                        "^fs/fuse/"
                    ]
                },
                "name": "fuse",
                "weight": 10
            }
        ]
    },
    "enable_syscalls": [
        "syz_mount_image$fuse",
        "syz_fuse_handle_req",
        "openat$fuse",
        "openat$cuse",
        "mount$fuse",
        "mount$fuseblk",
        "read$FUSE",
        "close",
        "openat$fuse_fuse_dev_operations",
        "ioctl$FUSE_DEV_IOC_BACKING_CLOSE_fuse_dev_operations",
        "ioctl$FUSE_DEV_IOC_BACKING_OPEN_fuse_dev_operations",
        "ioctl$FUSE_DEV_IOC_CLONE_fuse_dev_operations",
        "openat$fuse_fuse_file_operations",
        "ioctl$FS_IOC_RESVSP64_fuse_file_operations",
        "ioctl$FS_IOC_UNRESVSP_fuse_file_operations",
        "ioctl$FS_IOC_UNRESVSP64_fuse_file_operations",
        "ioctl$FS_IOC_ZERO_RANGE_fuse_file_operations"
    ]
}
