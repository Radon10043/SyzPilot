{
    "kernel_subsystem": [
        {
            "name": "comedi",
            "path": [
                "drivers/comedi"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "filter": {
                    "files": [
                        "^drivers/comedi/"
                    ]
                },
                "name": "comedi",
                "weight": 10
            }
        ]
    },
    "enable_syscalls": [
        "openat$comedi",
        "read",
        "write",
        "close",
        "mmap",
        "munmap",
        "syz_open_dev$comedi_comedi_fops",
        "ioctl$COMEDI_BUFCONFIG_comedi_fops",
        "ioctl$COMEDI_BUFINFO_comedi_fops",
        "ioctl$COMEDI_CHANINFO_comedi_fops",
        "ioctl$COMEDI_CMD_comedi_fops",
        "ioctl$COMEDI_DEVCONFIG_comedi_fops",
        "ioctl$COMEDI_DEVINFO_comedi_fops",
        "ioctl$COMEDI_INSN_comedi_fops",
        "ioctl$COMEDI_INSNLIST_comedi_fops",
        "ioctl$COMEDI_LOCK_comedi_fops",
        "ioctl$COMEDI_POLL_comedi_fops",
        "ioctl$COMEDI_RANGEINFO_comedi_fops",
        "ioctl$COMEDI_SETRSUBD_comedi_fops",
        "ioctl$COMEDI_SUBDINFO_comedi_fops"
    ]
}
