#############################
### General configuration ###
#############################
x-base: &base
  image: github.com/radon10043/cloud:latest
  privileged: true
  cpus: ${EXPERIMENT_CPUS}
  tmpfs:
    - /tmp
    - /var/tmp
  environment: &env
    TMPDIR: /tmp
    VMCOUNT: ${EXPERIMENT_VMCOUNT}
    CLOUD: ${EXPERIMENT_ROOT_CONTAINER}/fuzzer/cloud
    SYZKALLER: ${EXPERIMENT_ROOT_CONTAINER}/fuzzer/cloud/syzkaller
    OUTROOT: ${EXPERIMENT_ROOT_CONTAINER}/experiment/SyzPilot-noiter
  volumes:
    - /etc/timezone:/etc/timezone:ro
    - /etc/localtime:/etc/localtime:ro
    - ${EXPERIMENT_ROOT_HOST:?EXPERIMENT_ROOT_HOST is required}:${EXPERIMENT_ROOT_CONTAINER:?EXPERIMENT_ROOT_CONTAINER is required}

####################
### Project name ###
####################
name: github.com/Radon10043/cloud-noiter

services:
  linux-v6.18-autofs:
    <<: *base
    environment:
      <<: *env
      KERNEL: ${EXPERIMENT_ROOT_CONTAINER}/kernel/linux/v6.18
      IMAGE: ${EXPERIMENT_ROOT_CONTAINER}/image/debian/bullseye
      KERNEL_NAME: linux
      KERNEL_VERSION: "v6.18"
      SUBSYSTEM: autofs
    command:
      - bash
      - -ceu
      - |
        export SUFFIX="$$(cat /proc/sys/kernel/random/uuid | cut -d- -f1)"
        export WORKDIR="$$OUTROOT/$$KERNEL_NAME-$$KERNEL_VERSION-$$SUBSYSTEM/out-$$SUFFIX"
        mkdir -p $$WORKDIR
        perl -pe 's/__([a-zA-Z0-9_]+)__/$$ENV{$$1}/g' "$$CLOUD/configs/fuzz/$$KERNEL_NAME/kernel.cfg" > /fuzz.cfg
        jq '.syzkaller = "/syzkaller"' /fuzz.cfg > /tmp.cfg && mv /tmp.cfg /fuzz.cfg
        jq -s 'add' /fuzz.cfg $$CLOUD/experiment/SyzPilot-noiter/configs/$$KERNEL_NAME/$$SUBSYSTEM.cfg > $$WORKDIR/fuzz.cfg
        cp -r $$SYZKALLER /syzkaller && rm -rf /syzkaller/bin && cp -r $$CLOUD/bin-noiter /syzkaller/bin
        timeout -s KILL 6h /syzkaller/bin/syz-manager -config $$WORKDIR/fuzz.cfg -bench $$WORKDIR/bench.log > $$WORKDIR/fuzz.log 2>&1

