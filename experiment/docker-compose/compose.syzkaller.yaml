#############################
### General configuration ###
#############################
x-base: &base
  image: github.com/google/syzkaller:latest
  privileged: true
  cpus: ${EXPERIMENT_CPUS}
  tmpfs:
    - /tmp
    - /var/tmp
  environment: &env
    TMPDIR: /tmp
    VMCOUNT: ${EXPERIMENT_VMCOUNT}
    CLOUD: ${EXPERIMENT_ROOT_CONTAINER}/fuzzer/cloud
    SYZKALLER: ${EXPERIMENT_ROOT_CONTAINER}/fuzzer/syzkaller
    OUTROOT: ${EXPERIMENT_ROOT_CONTAINER}/experiment/syzkaller
  volumes:
    - /etc/timezone:/etc/timezone:ro
    - /etc/localtime:/etc/localtime:ro
    - ${EXPERIMENT_ROOT_HOST:?EXPERIMENT_ROOT_HOST is required}:${EXPERIMENT_ROOT_CONTAINER:?EXPERIMENT_ROOT_CONTAINER is required}

####################
### Project name ###
####################
name: github.com/google/syzkaller

services:

###############
### Kernels ###
###############

  linux-v6.18-kernel:
    <<: *base
    environment:
      <<: *env
      KERNEL: ${EXPERIMENT_ROOT_CONTAINER}/kernel/linux/v6.18
      IMAGE: ${EXPERIMENT_ROOT_CONTAINER}/image/debian/bullseye
      KERNEL_NAME: linux
      KERNEL_VERSION: "v6.18"
      SUBSYSTEM: kernel
    command:
      - bash
      - -ceu
      - |
        export SUFFIX="$$(cat /proc/sys/kernel/random/uuid | cut -d- -f1)"
        export WORKDIR="$$OUTROOT/$$KERNEL_NAME-$$KERNEL_VERSION-$$SUBSYSTEM/out-$$SUFFIX"
        mkdir -p $$WORKDIR
        perl -pe 's/__([a-zA-Z0-9_]+)__/$$ENV{$$1}/g' "$$CLOUD/configs/fuzz/$$KERNEL_NAME/$$SUBSYSTEM.cfg" > "$$WORKDIR/fuzz.cfg"
        timeout -s KILL 24h "$$SYZKALLER/bin/syz-manager" -config $$WORKDIR/fuzz.cfg -bench $$WORKDIR/bench.log > "$$WORKDIR/fuzz.log" 2>&1

