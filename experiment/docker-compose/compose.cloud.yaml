# plase replace __XXX__ with actual values before using this file
#
# usage:
#   docker compose -f $THIS_FILE up $SERVICE --scale $SERVICE=$NUM_INSTANCE -d

#############################
### General configuration ###
#############################
x-base: &base
  image: github.com/Radon10043/cloud:latest
  privileged: true
  cpus: __CPUS__
  environment: &env
    VMCOUNT: __VMCOUNT__
    CLOUD: __CLOUD__
    SYZKALLER: __CLOUD__/syzkaller
    OUTROOT: __OUTROOT__
  volumes:
    - /etc/timezone:/etc/timezone:ro
    - /etc/localtime:/etc/localtime:ro
    - __VOLUMES__

####################
### Project name ###
####################
name: github.com/Radon10043/cloud

services:
  linux-v6.18-kernel:
    <<: *base
    environment:
      <<: *env
      KERNEL: __LINUX_V_6_18_KERNEL__
      IMAGE: __DEBIAN_BULLSEYE__
      KERNEL_NAME: linux
      KERNEL_VERSION: "6.18"
      SUBSYSTEM: kernel
    command:
      - bash
      - -ceu
      - |
        export SUFFIX="$$(cat /proc/sys/kernel/random/uuid | cut -d- -f1)"
        export WORKDIR="$$OUTROOT/$$KERNEL_NAME-$$KERNEL_VERSION-$$SUBSYSTEM/out-$$SUFFIX"
        mkdir -p "$$WORKDIR"
        perl -pe 's/__([a-zA-Z0-9_]+)__/$$ENV{$$1}/g' "$$CLOUD/configs/fuzz/$$KERNEL_NAME/$$SUBSYSTEM.cfg" > "$$WORKDIR/fuzz.cfg"
        timeout -s KILL 24h "$$SYZKALLER/bin/syz-manager" -config "$$WORKDIR/fuzz.cfg" > "$$WORKDIR/fuzz.log" 2>&1

