#############################
### General configuration ###
#############################
x-base: &base
  image: github.com/radon10043/cloud:latest
  privileged: true
  cpus: ${EXPERIMENT_CPUS}
  environment: &env
    VMCOUNT: ${EXPERIMENT_VMCOUNT}
    CLOUD: ${EXPERIMENT_ROOT}/fuzzer/cloud
    SYZKALLER: ${EXPERIMENT_ROOT}/fuzzer/cloud/syzkaller
    OUTROOT: ${EXPERIMENT_ROOT}/experiment/cloud
  volumes:
    - /etc/timezone:/etc/timezone:ro
    - /etc/localtime:/etc/localtime:ro
    - ${MOUNT:?MOUNT is required}

####################
### Project name ###
####################
name: github.com/Radon10043/cloud

services:
  linux-v6.18-kernel:
    <<: *base
    environment:
      <<: *env
      KERNEL: ${EXPERIMENT_ROOT}/kernel/linux/v6.18
      IMAGE: ${EXPERIMENT_ROOT}/images/Debian/bullseye
      KERNEL_NAME: linux
      KERNEL_VERSION: "v6.18"
      SUBSYSTEM: kernel
    command:
      - bash
      - -ceu
      - |
        export SUFFIX="$$(cat /proc/sys/kernel/random/uuid | cut -d- -f1)"
        export WORKDIR="$$OUTROOT/$$KERNEL_NAME-$$KERNEL_VERSION-$$SUBSYSTEM/out-$$SUFFIX"
        mkdir -p "$$WORKDIR"
        perl -pe 's/__([a-zA-Z0-9_]+)__/$$ENV{$$1}/g' "$$CLOUD/configs/fuzz/$$KERNEL_NAME/$$SUBSYSTEM.cfg" > "$$WORKDIR/fuzz.cfg"
        timeout -s KILL 24h "$$SYZKALLER/bin/syz-manager" -config "$$WORKDIR/fuzz.cfg" > "$$WORKDIR/fuzz.log" 2>&1

