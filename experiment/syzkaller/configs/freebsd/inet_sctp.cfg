{
    "enable_syscalls": [
        "socket$inet_sctp", "socket$inet6_sctp",
        "accept$inet", "bind$inet", "connect$inet",
        "sendto$inet", "recvfrom$inet",
        "getsockname$inet", "getpeername$inet",
        "listen",
        "sendmsg$inet_sctp", "sendmsg$inet6_sctp",
        "getsockopt$inet_sctp*", "setsockopt$inet_sctp*",
        "getsockopt$inet6_sctp*", "setsockopt$inet6_sctp*",
        "read", "write", "close"
    ]
}
