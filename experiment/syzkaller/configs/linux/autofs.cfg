{
    "kernel_subsystem": [
        { "name": "autofs", "path": ["fs/autofs"] }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "autofs",
                "filter": { "files": ["^fs/autofs/"] },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "mount", "openat$autofs",
        "ioctl$AUTOFS_IOC_*",
        "ioctl$AUTOFS_DEV_IOCTL_*",
        "open", "openat", "close",
        "read", "write",
        "stat", "lstat", "fstat",
        "mkdir", "mkdirat", "rmdir",
        "symlink", "symlinkat", "readlink", "readlinkat",
        "unlink", "unlinkat",
        "rename", "renameat", "renameat2",
        "getdents64"
    ]
}
