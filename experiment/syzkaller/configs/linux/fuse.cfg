{
    "kernel_subsystem": [
        { "name": "fuse", "path": ["fs/fuse"] }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "fuse",
                "filter": { "files": ["^fs/fuse/"] },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "syz_mount_image$fuse",
        "syz_fuse_handle_req",
        "openat$fuse", "openat$cuse",
        "mount$fuse", "mount$fuseblk",
        "ioctl$FUSE_DEV_IOC_*",
        "read$FUSE",
        "write$FUSE_*",
        "close"
    ]
}
