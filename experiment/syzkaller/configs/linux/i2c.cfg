{
    "kernel_subsystem": [
        { "name": "i2c", "path": ["drivers/i2c"] }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "i2c",
                "filter": { "files": ["^drivers/i2c/"] },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "syz_open_dev$I2C",
        "ioctl$I2C_*",
        "read", "write", "close"
    ]
}
