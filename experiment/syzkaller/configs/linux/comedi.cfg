{
    "kernel_subsystem": [
        { "name": "comedi", "path": ["drivers/comedi"] }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "comedi",
                "filter": { "files": ["^drivers/comedi/"] },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "openat$comedi",
        "ioctl$COMEDI_*",
        "read", "write", "close",
        "mmap", "munmap"
    ]
}
