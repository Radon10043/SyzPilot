{
    "kernel_subsystem": [
        { "name": "phonet", "path": ["net/phonet"] }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "phonet",
                "filter": { "files": ["^net/phonet/"] },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "socket$phonet", "socket$phonet_pipe",
        "bind$phonet",
        "connect$phonet_pipe",
        "accept$phonet_pipe", "accept4$phonet_pipe",
        "sendto$phonet", "recvfrom$phonet",
        "listen",
        "ioctl$SIOCPNADDRESOURCE", "ioctl$SIOCPNDELRESOURCE",
        "ioctl$SIOCPNENABLEPIPE", "ioctl$SIOCPNGETOBJECT",
        "setsockopt$PNPIPE_ENCAP", "getsockopt$PNPIPE_ENCAP",
        "setsockopt$PNPIPE_HANDLE", "getsockopt$PNPIPE_HANDLE",
        "setsockopt$PNPIPE_INITSTATE", "getsockopt$PNPIPE_INITSTATE",
        "getsockopt$PNPIPE_IFINDEX",
        "read", "write", "close"
    ]
}
