{
    "kernel_subsystem": [
        { "name": "dri", "path": ["drivers/gpu/drm"] }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "dri",
                "filter": { "files": ["^drivers/gpu/drm/"] },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "syz_open_dev$dri",
        "syz_open_dev$dricontrol",
        "syz_open_dev$drirender",
        "openat$drirender128",
        "ioctl$DRM_IOCTL_*",
        "read", "write", "close",
        "mmap", "munmap", "poll"
    ]
}
