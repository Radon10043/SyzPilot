{
    "kernel_subsystem": [
        { "name": "btrfs", "path": ["fs/btrfs"] }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "btrfs",
                "filter": { "files": ["^fs/btrfs/"] },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "syz_mount_image$btrfs",
        "openat$btrfs_control",
        "ioctl$BTRFS_*",
        "open", "openat", "creat", "close",
        "read", "pread64", "readv", "preadv",
        "write", "pwrite64", "writev", "pwritev",
        "lseek", "mmap", "munmap", "mremap", "msync", "madvise",
        "stat", "lstat", "fstat", "newfstatat", "getdents64",
        "ftruncate", "truncate", "fallocate", "fsync", "fdatasync",
        "chmod", "fchmod", "fchmodat",
        "chown", "fchown", "fchownat", "lchown",
        "mkdir", "mkdirat", "rmdir",
        "link", "linkat", "unlink", "unlinkat",
        "symlink", "symlinkat", "readlink", "readlinkat",
        "rename", "renameat", "renameat2",
        "setxattr", "getxattr", "listxattr", "removexattr",
        "lsetxattr", "lgetxattr", "llistxattr", "lremovexattr",
        "fsetxattr", "fgetxattr", "flistxattr", "fremovexattr",
        "name_to_handle_at", "open_by_handle_at",
        "ioctl$FITRIM", "ioctl$FS_IOC_FIEMAP",
        "ioctl$FS_IOC_GETFLAGS", "ioctl$FS_IOC_SETFLAGS",
        "ioctl$FS_IOC_GETFSLABEL", "ioctl$FS_IOC_SETFSLABEL",
        "splice", "tee", "sendfile"
    ]
}
