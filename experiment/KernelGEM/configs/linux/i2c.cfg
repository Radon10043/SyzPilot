{
    "kernel_subsystem": [
        { "name": "i2c", "path": ["drivers/i2c"] }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "i2c",
                "filter": { "files": ["^drivers/i2c/"] },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "syz_open_dev$I2C",
        "ioctl$I2C_*",
        "read", "write", "close",
        "syz_open_dev$KGPT_i2c",
        "ioctl$KGPT_I2C_SLAVE",
        "ioctl$KGPT_I2C_SLAVE_FORCE",
        "ioctl$KGPT_I2C_TENBIT",
        "ioctl$KGPT_I2C_PEC",
        "ioctl$KGPT_I2C_FUNCS",
        "ioctl$KGPT_I2C_RDWR",
        "ioctl$KGPT_I2C_SMBUS",
        "ioctl$KGPT_I2C_RETRIES",
        "ioctl$KGPT_I2C_TIMEOUT"
    ]
}
