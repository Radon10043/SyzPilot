{
    "kernel_subsystem": [
        { "name": "autofs", "path": ["fs/autofs"] }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "autofs",
                "filter": { "files": ["^fs/autofs/"] },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "mount", "openat$autofs",
        "ioctl$AUTOFS_IOC_*",
        "ioctl$AUTOFS_DEV_IOCTL_*",
        "open", "openat", "close",
        "read", "write",
        "stat", "lstat", "fstat",
        "mkdir", "mkdirat", "rmdir",
        "symlink", "symlinkat", "readlink", "readlinkat",
        "unlink", "unlinkat",
        "rename", "renameat", "renameat2",
        "getdents64",
        "openat$KGPT_autofs",
        "ioctl$KGPT_AUTOFS_DEV_IOCTL_VERSION",
        "ioctl$KGPT_AUTOFS_DEV_IOCTL_PROTOVER",
        "ioctl$KGPT_AUTOFS_DEV_IOCTL_PROTOSUBVER",
        "ioctl$KGPT_AUTOFS_DEV_IOCTL_OPENMOUNT",
        "ioctl$KGPT_AUTOFS_DEV_IOCTL_CLOSEMOUNT",
        "ioctl$KGPT_AUTOFS_DEV_IOCTL_READY",
        "ioctl$KGPT_AUTOFS_DEV_IOCTL_FAIL",
        "ioctl$KGPT_AUTOFS_DEV_IOCTL_SETPIPEFD",
        "ioctl$KGPT_AUTOFS_DEV_IOCTL_CATATONIC",
        "ioctl$KGPT_AUTOFS_DEV_IOCTL_TIMEOUT",
        "ioctl$KGPT_AUTOFS_DEV_IOCTL_REQUESTER",
        "ioctl$KGPT_AUTOFS_DEV_IOCTL_EXPIRE",
        "ioctl$KGPT_AUTOFS_DEV_IOCTL_ASKUMOUNT",
        "ioctl$KGPT_AUTOFS_DEV_IOCTL_ISMOUNTPOINT",
        "ioctl$KGPT_AUTOFS_DEV_IOCTL_VERSION_CMD",
        "ioctl$KGPT_AUTOFS_DEV_IOCTL_ISMOUNTPOINT_CMD",
        "ioctl$KGPT_AUTOFS_DEV_IOCTL_OPENMOUNT_CMD",
        "ioctl$KGPT_AUTOFS_DEV_IOCTL_CLOSEMOUNT_CMD",
        "ioctl$KGPT_AUTOFS_DEV_IOCTL_CATATONIC_CMD",
        "ioctl$KGPT_AUTOFS_IOC_CATATONIC",
        "ioctl$KGPT_AUTOFS_IOC_READY",
        "ioctl$KGPT_AUTOFS_IOC_FAIL",
        "ioctl$KGPT_AUTOFS_IOC_PROTOVER",
        "ioctl$KGPT_AUTOFS_IOC_PROTOSUBVER",
        "ioctl$KGPT_AUTOFS_IOC_SETTIMEOUT",
        "ioctl$KGPT_AUTOFS_IOC_EXPIRE",
        "ioctl$KGPT_AUTOFS_IOC_EXPIRE_MULTI",
        "ioctl$KGPT_AUTOFS_IOC_ASKUMOUNT"
    ]
}
