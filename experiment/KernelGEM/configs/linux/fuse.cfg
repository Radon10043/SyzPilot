{
    "kernel_subsystem": [
        {
            "name": "fuse",
            "path": [
                "fs/fuse"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "fuse",
                "filter": {
                    "files": [
                        "^fs/fuse/"
                    ]
                },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "syz_mount_image$fuse",
        "syz_fuse_handle_req",
        "openat$cuse",
        "mount$fuse",
        "mount$fuseblk",
        "read$FUSE",
        "write$FUSE_*",
        "close",
        "openat$KGPT_fuse",
        "ioctl$KGPT_FUSE_DEV_IOC_SYNC_INIT",
        "ioctl$KGPT_FUSE_DEV_IOC_CLONE",
        "ioctl$KGPT_FUSE_DEV_IOC_BACKING_OPEN",
        "ioctl$KGPT_FUSE_DEV_IOC_BACKING_CLOSE",
        "ioctl$KGPT_FS_IOC_MEASURE_VERITY",
        "ioctl$KGPT_FS_IOC_ENABLE_VERITY"
    ]
}
