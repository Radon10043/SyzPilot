{
    "kernel_subsystem": [
        { "name": "sg", "path": ["drivers/scsi/sg.c"] }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "sg",
                "filter": { "files": ["^drivers/scsi/sg\\."] },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "syz_open_dev$sg",
        "ioctl$SG_*",
        "ioctl$SCSI_IOCTL_*",
        "read", "write", "close",
        "mmap", "munmap", "poll",
        "syz_open_dev$KGPT_sg",
        "ioctl$KGPT_SG_IO",
        "ioctl$KGPT_SG_SET_TIMEOUT",
        "ioctl$KGPT_SG_GET_TIMEOUT",
        "ioctl$KGPT_SG_SET_RESERVED_SIZE",
        "ioctl$KGPT_SG_GET_RESERVED_SIZE",
        "ioctl$KGPT_SG_GET_VERSION_NUM",
        "ioctl$KGPT_SG_EMULATED_HOST",
        "ioctl$KGPT_SG_SCSI_RESET",
        "ioctl$KGPT_SCSI_IOCTL_SEND_COMMAND",
        "ioctl$KGPT_SCSI_IOCTL_TEST_UNIT_READY",
        "ioctl$KGPT_SCSI_IOCTL_DOORLOCK",
        "ioctl$KGPT_SCSI_IOCTL_DOORUNLOCK",
        "ioctl$KGPT_SCSI_IOCTL_START_UNIT",
        "ioctl$KGPT_SCSI_IOCTL_STOP_UNIT",
        "ioctl$KGPT_SCSI_IOCTL_GET_BUS_NUMBER",
        "ioctl$KGPT_SCSI_IOCTL_GET_PCI",
        "ioctl$KGPT_SCSI_IOCTL_PROBE_HOST",
        "ioctl$KGPT_SCSI_IOCTL_GET_IDLUN",
        "ioctl$KGPT_CDROMCLOSETRAY",
        "ioctl$KGPT_CDROMEJECT",
        "ioctl$KGPT_CDROM_SEND_PACKET"
    ]
}
