{
    "kernel_subsystem": [
        {
            "name": "phonet",
            "path": [
                "net/phonet"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "phonet",
                "filter": {
                    "files": [
                        "^net/phonet/"
                    ]
                },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "listen",
        "read",
        "write",
        "close",
        "socket$KGPT_phonet_dgram",
        "bind$KGPT_phonet_dgram_ops",
        "connect$KGPT_phonet_dgram_ops",
        "accept4$KGPT_phonet_dgram_ops",
        "sendto$KGPT_phonet_dgram_ops",
        "recvfrom$KGPT_phonet_dgram_ops",
        "socket$KGPT_phonet_stream",
        "bind$KGPT_phonet_stream_ops",
        "connect$KGPT_phonet_stream_ops",
        "accept4$KGPT_phonet_stream_ops",
        "sendto$KGPT_phonet_stream_ops",
        "recvfrom$KGPT_phonet_stream_ops",
        "socket$KGPT_phonet_pep",
        "connect$KGPT_pep_proto",
        "accept4$KGPT_pep_proto",
        "sendto$KGPT_pep_proto",
        "recvfrom$KGPT_pep_proto",
        "ioctl$KGPT_SIOCPNENABLEPIPE",
        "ioctl$KGPT_SIOCINQ",
        "getsockopt$KGPT_PNPIPE_ENCAP",
        "getsockopt$KGPT_PNPIPE_IFINDEX",
        "getsockopt$KGPT_PNPIPE_HANDLE",
        "getsockopt$KGPT_PNPIPE_INITSTATE",
        "setsockopt$KGPT_PNPIPE_ENCAP",
        "setsockopt$KGPT_PNPIPE_HANDLE",
        "setsockopt$KGPT_PNPIPE_INITSTATE",
        "ioctl$KGPT_SIOCPNGETOBJECT",
        "ioctl$KGPT_SIOCPNADDRESOURCE",
        "ioctl$KGPT_SIOCPNDELRESOURCE",
        "ioctl$KGPT_SIOCGETVIFCNT",
        "ioctl$KGPT_SIOCGETSGCNT",
        "ioctl$KGPT_SIOCGETMIFCNT_IN6",
        "ioctl$KGPT_SIOCGETSGCNT_IN6"
    ]
}
