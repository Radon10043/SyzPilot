{
    "kernel_subsystem": [
        {
            "name": "ptp",
            "path": ["drivers/ptp"]
        }
    ],
    "experimental": {
        "focus_areas": [
            {"name": "ptp", "filter": {"files": ["^drivers/ptp/"]},"weight": 10.0}
        ]
    },
    "enable_syscalls": [
        "openat$ptp0",
        "openat$ptp1",
        "ioctl$PTP_*",
        "read$ptp",
        "close",
        "syz_open_dev$KGPT_ptp",
        "ioctl$KGPT_PTP_*"
    ]
}
