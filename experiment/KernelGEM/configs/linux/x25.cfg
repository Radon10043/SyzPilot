{
    "kernel_subsystem": [
        { "name": "x25", "path": ["net/x25"] }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "x25",
                "filter": { "files": ["^net/x25/"] },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "syz_init_net_socket$x25",
        "bind$x25", "connect$x25",
        "sendto$x25", "recvfrom$x25",
        "listen", "accept", "accept4",
        "setsockopt$X25_QBITINCL", "getsockopt$X25_QBITINCL",
        "ioctl$sock_x25_SIOCADDRT", "ioctl$sock_x25_SIOCDELRT",
        "ioctl$SIOCX25GSUBSCRIP", "ioctl$SIOCX25SSUBSCRIP",
        "ioctl$SIOCX25GFACILITIES", "ioctl$SIOCX25SFACILITIES",
        "ioctl$SIOCX25GDTEFACILITIES", "ioctl$SIOCX25SDTEFACILITIES",
        "ioctl$SIOCX25GCALLUSERDATA", "ioctl$SIOCX25SCALLUSERDATA",
        "ioctl$SIOCX25GCAUSEDIAG", "ioctl$SIOCX25SCAUSEDIAG",
        "ioctl$SIOCX25SCUDMATCHLEN",
        "ioctl$SIOCX25CALLACCPTAPPRV", "ioctl$SIOCX25SENDCALLACCPT",
        "read", "write", "close",
        "syz_init_net_socket$KGPT_x25",
        "bind$KGPT_x25_proto_ops",
        "connect$KGPT_x25_proto_ops",
        "accept4$KGPT_x25_proto_ops",
        "sendto$KGPT_x25_proto_ops",
        "recvfrom$KGPT_x25_proto_ops",
        "getsockopt$KGPT_X25_QBITINCL",
        "setsockopt$KGPT_X25_QBITINCL",
        "ioctl$KGPT_SIOCGIFADDR",
        "ioctl$KGPT_SIOCSIFADDR",
        "ioctl$KGPT_SIOCGIFDSTADDR",
        "ioctl$KGPT_SIOCSIFDSTADDR",
        "ioctl$KGPT_SIOCGIFBRDADDR",
        "ioctl$KGPT_SIOCSIFBRDADDR",
        "ioctl$KGPT_SIOCGIFNETMASK",
        "ioctl$KGPT_SIOCSIFNETMASK",
        "ioctl$KGPT_SIOCGIFMETRIC",
        "ioctl$KGPT_SIOCSIFMETRIC",
        "ioctl$KGPT_SIOCX25CALLACCPTAPPRV",
        "ioctl$KGPT_SIOCX25SENDCALLACCPT",
        "ioctl$KGPT_TIOCOUTQ",
        "ioctl$KGPT_TIOCINQ",
        "ioctl$KGPT_SIOCADDRT",
        "ioctl$KGPT_SIOCDELRT",
        "ioctl$KGPT_SIOCX25GSUBSCRIP",
        "ioctl$KGPT_SIOCX25SSUBSCRIP",
        "ioctl$KGPT_SIOCX25GFACILITIES",
        "ioctl$KGPT_SIOCX25SFACILITIES",
        "ioctl$KGPT_SIOCX25GDTEFACILITIES",
        "ioctl$KGPT_SIOCX25SDTEFACILITIES",
        "ioctl$KGPT_SIOCX25GCALLUSERDATA",
        "ioctl$KGPT_SIOCX25SCALLUSERDATA",
        "ioctl$KGPT_SIOCX25GCAUSEDIAG",
        "ioctl$KGPT_SIOCX25SCAUSEDIAG",
        "ioctl$KGPT_SIOCX25SCUDMATCHLEN"
    ]
}
