{
    "kernel_subsystem": [
        {
            "name": "kvm",
            "path": [
                "arch/x86/kvm",
                "virt/kvm"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "kvm",
                "filter": {
                    "files": [
                        "^arch/x86/kvm/",
                        "^virt/kvm/"
                    ]
                },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "syz_kvm_setup_cpu$x86",
        "syz_kvm_setup_syzos_vm$x86",
        "syz_kvm_add_vcpu$x86",
        "syz_kvm_assert_syzos_uexit$x86",
        "syz_kvm_assert_syzos_kvm_exit$x86",
        "read",
        "write",
        "close",
        "mmap",
        "munmap",
        "openat$KGPT_kvm",
        "ioctl$KGPT_KVM_GET_API_VERSION",
        "ioctl$KGPT_KVM_GET_VCPU_MMAP_SIZE",
        "ioctl$KGPT_KVM_CREATE_VM",
        "ioctl$KGPT_KVM_CHECK_EXTENSION",
        "ioctl$KGPT_KVM_GET_MSR_INDEX_LIST",
        "ioctl$KGPT_KVM_GET_SUPPORTED_CPUID",
        "ioctl$KGPT_KVM_GET_EMULATED_CPUID",
        "ioctl$KGPT_KVM_X86_GET_MCE_CAP_SUPPORTED",
        "ioctl$KGPT_KVM_GET_MSR_FEATURE_INDEX_LIST",
        "ioctl$KGPT_KVM_GET_MSRS",
        "ioctl$KGPT_KVM_GET_SUPPORTED_HV_CPUID",
        "ioctl$KGPT_KVM_GET_DEVICE_ATTR",
        "ioctl$KGPT_KVM_HAS_DEVICE_ATTR",
        "ioctl$KGPT_KVM_SET_DEVICE_ATTR",
        "ioctl$KGPT_KVM_RUN",
        "ioctl$KGPT_KVM_GET_STATS_FD",
        "ioctl$KGPT_KVM_GET_REGS",
        "ioctl$KGPT_KVM_SET_REGS",
        "ioctl$KGPT_KVM_GET_SREGS",
        "ioctl$KGPT_KVM_SET_SREGS",
        "ioctl$KGPT_KVM_GET_MP_STATE",
        "ioctl$KGPT_KVM_SET_MP_STATE",
        "ioctl$KGPT_KVM_TRANSLATE",
        "ioctl$KGPT_KVM_SET_GUEST_DEBUG",
        "ioctl$KGPT_KVM_SET_SIGNAL_MASK",
        "ioctl$KGPT_KVM_GET_FPU",
        "ioctl$KGPT_KVM_SET_FPU",
        "ioctl$KGPT_KVM_PRE_FAULT_MEMORY"
    ]
}
