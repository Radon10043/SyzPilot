{
    "kernel_subsystem": [
        {
            "name": "input",
            "path": [
                "drivers/input"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "input",
                "filter": {
                    "files": [
                        "^drivers/input/"
                    ]
                },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "syz_open_dev$mouse",
        "syz_open_dev$evdev",
        "openat$mice",
        "write$evdev",
        "write$uinput_user_dev",
        "write$input_event",
        "ioctl$EVIOC*",
        "read",
        "close",
        "poll",
        "syz_open_dev$KGPT_serport",
        "ioctl$KGPT_SPIOCSTYPE",
        "syz_open_dev$KGPT_sur40",
        "ioctl$KGPT_VIDIOC_DQBUF",
        "ioctl$KGPT_VIDIOC_QBUF",
        "ioctl$KGPT_VIDIOC_STREAMON",
        "ioctl$KGPT_VIDIOC_STREAMOFF",
        "ioctl$KGPT_VIDIOC_SUBDEV_G_ROUTING",
        "ioctl$KGPT_VIDIOC_SUBDEV_S_ROUTING",
        "openat$KGPT_uinput",
        "ioctl$KGPT_UI_DEV_CREATE",
        "ioctl$KGPT_UI_DEV_DESTROY",
        "ioctl$KGPT_UI_GET_VERSION",
        "ioctl$KGPT_UI_DEV_SETUP",
        "ioctl$KGPT_UI_ABS_SETUP",
        "ioctl$KGPT_UI_SET_EVBIT",
        "ioctl$KGPT_UI_SET_KEYBIT",
        "ioctl$KGPT_UI_SET_RELBIT",
        "ioctl$KGPT_UI_SET_ABSBIT",
        "ioctl$KGPT_UI_SET_MSCBIT",
        "ioctl$KGPT_UI_SET_LEDBIT",
        "ioctl$KGPT_UI_SET_SNDBIT",
        "ioctl$KGPT_UI_SET_FFBIT",
        "ioctl$KGPT_UI_SET_SWBIT",
        "ioctl$KGPT_UI_SET_PROPBIT",
        "ioctl$KGPT_UI_SET_PHYS",
        "ioctl$KGPT_UI_BEGIN_FF_UPLOAD",
        "ioctl$KGPT_UI_END_FF_UPLOAD",
        "ioctl$KGPT_UI_BEGIN_FF_ERASE",
        "ioctl$KGPT_UI_END_FF_ERASE"
    ]
}
