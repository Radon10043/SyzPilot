{
    "kernel_subsystem": [
        { "name": "ax25", "path": ["net/ax25", "net/netrom", "net/rose"] }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "ax25",
                "filter": { "files": ["^net/ax25/", "^net/netrom/", "^net/rose/"] },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "syz_init_net_socket$ax25", "bind$ax25", "connect$ax25",
        "accept$ax25", "accept4$ax25",
        "sendto$ax25", "recvfrom$ax25",
        "getsockname$ax25", "getpeername$ax25",
        "getsockopt$ax25_int", "setsockopt$ax25_int",
        "setsockopt$ax25_SO_BINDTODEVICE",
        "ioctl$SIOCAX25ADDUID", "ioctl$SIOCAX25DELUID",
        "ioctl$SIOCAX25GETUID", "ioctl$SIOCAX25NOUID",
        "ioctl$SIOCAX25CTLCON", "ioctl$SIOCAX25GETINFO", "ioctl$SIOCAX25GETINFOOLD",
        "ioctl$SIOCAX25ADDFWD", "ioctl$SIOCAX25DELFWD",
        "ioctl$sock_ax25_SIOCADDRT", "ioctl$sock_ax25_SIOCDELRT",
        "ioctl$SIOCAX25OPTRT",
        "syz_init_net_socket$netrom", "bind$netrom", "connect$netrom",
        "accept$netrom", "accept4$netrom",
        "sendto$netrom", "recvfrom$netrom",
        "getsockname$netrom", "getpeername$netrom",
        "setsockopt$netrom_NETROM_T1", "setsockopt$netrom_NETROM_T2",
        "setsockopt$netrom_NETROM_N2", "setsockopt$netrom_NETROM_T4",
        "setsockopt$netrom_NETROM_IDLE",
        "getsockopt$netrom_NETROM_T1", "getsockopt$netrom_NETROM_T2",
        "getsockopt$netrom_NETROM_N2", "getsockopt$netrom_NETROM_T4",
        "getsockopt$netrom_NETROM_IDLE",
        "ioctl$sock_netrom_SIOCADDRT", "ioctl$sock_netrom_SIOCDELRT",
        "ioctl$SIOCNRDECOBS",
        "syz_init_net_socket$rose", "bind$rose", "connect$rose", "accept4$rose",
        "sendto$rose", "recvfrom$rose",
        "setsockopt$rose", "getsockopt$rose",
        "ioctl$sock_rose_SIOCADDRT", "ioctl$sock_rose_SIOCDELRT",
        "ioctl$sock_rose_SIOCRSCLRRT",
        "ioctl$SIOCRSGCAUSE", "ioctl$SIOCRSSCAUSE",
        "ioctl$SIOCRSSL2CALL", "ioctl$SIOCRSGL2CALL",
        "ioctl$SIOCRSACCEPT",
        "listen", "read", "write", "close",
        "syz_init_net_socket$KGPT_ax25",
        "bind$KGPT_ax25_proto_ops",
        "connect$KGPT_ax25_proto_ops",
        "accept4$KGPT_ax25_proto_ops",
        "sendto$KGPT_ax25_proto_ops",
        "recvfrom$KGPT_ax25_proto_ops",
        "getsockopt$KGPT_SO_BINDTODEVICE",
        "setsockopt$KGPT_SO_BINDTODEVICE"
    ]
}
