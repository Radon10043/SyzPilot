{
    "kernel_subsystem": [
        { "name": "ppp", "path": ["drivers/net/ppp"] }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "ppp",
                "filter": { "files": ["^drivers/net/ppp/"] },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "openat$ppp",
        "write$ppp",
        "ioctl$PPPIOC*",
        "socket$pppoe", "socket$pppl2tp", "socket$pptp",
        "connect$pppoe", "connect$pppl2tp",
        "ioctl$PPPOEIOCSFWD", "ioctl$PPPOEIOCDFWD",
        "ioctl$PPPIOCGL2TPSTATS",
        "setsockopt$pppl2tp_*",
        "ioctl$PPPIOCSFLAGS", "ioctl$PPPIOCGFLAGS",
        "ioctl$PPPIOCSMRU", "ioctl$PPPIOCGMRU",
        "ioctl$PPPIOCGCHAN",
        "read", "close",
        "syz_open_dev$KGPT_ppp_async",
        "ioctl$KGPT_PPPIOCGFLAGS",
        "ioctl$KGPT_PPPIOCSFLAGS",
        "ioctl$KGPT_PPPIOCGASYNCMAP",
        "ioctl$KGPT_PPPIOCSASYNCMAP",
        "ioctl$KGPT_PPPIOCGRASYNCMAP",
        "ioctl$KGPT_PPPIOCSRASYNCMAP",
