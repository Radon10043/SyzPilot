{
    "kernel_subsystem": [
        { "name": "dri", "path": ["drivers/gpu/drm"] }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "dri",
                "filter": { "files": ["^drivers/gpu/drm/"] },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "syz_open_dev$dri",
        "syz_open_dev$dricontrol",
        "syz_open_dev$drirender",
        "openat$drirender128",
        "ioctl$DRM_IOCTL_*",
        "read", "write", "close",
        "mmap", "munmap", "poll",
        "syz_open_dev$KGPT_i915",
        "ioctl$KGPT_I915_PERF_IOCTL_ENABLE",
        "ioctl$KGPT_I915_PERF_IOCTL_DISABLE",
        "ioctl$KGPT_I915_PERF_IOCTL_CONFIG",
        "syz_open_dev$KGPT_vmwgfx",
        "ioctl$KGPT_DRM_VMW_EXECBUF",
        "ioctl$KGPT_DRM_VMW_UPDATE_LAYOUT"
    ]
}
