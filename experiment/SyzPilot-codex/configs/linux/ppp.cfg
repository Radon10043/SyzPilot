{
    "kernel_subsystem": [
        {
            "name": "ppp",
            "path": [
                "drivers/net/ppp"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "filter": {
                    "files": [
                        "^drivers/net/ppp/"
                    ]
                },
                "name": "ppp",
                "weight": 10
            }
        ]
    },
    "enable_syscalls": [
        "openat$ppp",
        "write$ppp",
        "socket$pppoe",
        "socket$pppl2tp",
        "socket$pptp",
        "connect$pppoe",
        "connect$pppl2tp",
        "ioctl$PPPOEIOCSFWD",
        "ioctl$PPPOEIOCDFWD",
        "ioctl$PPPIOCGL2TPSTATS",
        "ioctl$PPPIOCSFLAGS",
        "ioctl$PPPIOCGFLAGS",
        "ioctl$PPPIOCSMRU",
        "ioctl$PPPIOCGMRU",
        "ioctl$PPPIOCGCHAN",
        "read",
        "close",
        "openat$__CODEX_ppp",
        "write$__CODEX_ppp",
        "ioctl$__CODEX_PPPIOC*",
        "ioctl$__CODEX_SIOCGPPP*"
    ]
}
