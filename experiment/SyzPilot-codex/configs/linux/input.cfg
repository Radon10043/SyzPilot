{
    "kernel_subsystem": [
        {
            "name": "input",
            "path": [
                "drivers/input"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "filter": {
                    "files": [
                        "^drivers/input/"
                    ]
                },
                "name": "input",
                "weight": 10
            }
        ]
    },
    "enable_syscalls": [
        "syz_open_dev$mouse",
        "syz_open_dev$evdev",
        "openat$mice",
        "openat$uinput",
        "write$evdev",
        "write$uinput_user_dev",
        "write$input_event",
        "read",
        "close",
        "poll",
        "syz_open_dev$__CODEX_input_event",
        "openat$__CODEX_input_event0",
        "write$__CODEX_input_event",
        "ioctl$__CODEX_EVIOC*"
    ]
}
