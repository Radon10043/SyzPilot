{
    "kernel_subsystem": [
        {
            "name": "kvm",
            "path": [
                "arch/x86/kvm",
                "virt/kvm"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "filter": {
                    "files": [
                        "^arch/x86/kvm/",
                        "^virt/kvm/"
                    ]
                },
                "name": "kvm",
                "weight": 10
            }
        ]
    },
    "enable_syscalls": [
        "openat$kvm",
        "syz_kvm_setup_cpu$x86",
        "syz_kvm_setup_syzos_vm$x86",
        "syz_kvm_add_vcpu$x86",
        "syz_kvm_assert_syzos_uexit$x86",
        "syz_kvm_assert_syzos_kvm_exit$x86",
        "read",
        "write",
        "close",
        "mmap",
        "munmap",
        "openat$__CODEX_kvm",
        "ioctl$__CODEX_KVM_*"
    ]
}
