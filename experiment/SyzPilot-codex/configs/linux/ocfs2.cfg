{
    "kernel_subsystem": [
        {
            "name": "ocfs2",
            "path": [
                "fs/ocfs2"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "filter": {
                    "files": [
                        "^fs/ocfs2/"
                    ]
                },
                "name": "ocfs2",
                "weight": 10
            }
        ]
    },
    "enable_syscalls": [
        "syz_mount_image$ocfs2",
        "openat$ocfs2_control",
        "open",
        "openat",
        "creat",
        "close",
        "read",
        "pread64",
        "write",
        "pwrite64",
        "lseek",
        "mmap",
        "munmap",
        "msync",
        "stat",
        "lstat",
        "fstat",
        "getdents64",
        "ftruncate",
        "truncate",
        "fallocate",
        "fsync",
        "fdatasync",
        "chmod",
        "fchmod",
        "chown",
        "fchown",
        "lchown",
        "mkdir",
        "mkdirat",
        "rmdir",
        "link",
        "linkat",
        "unlink",
        "unlinkat",
        "symlink",
        "symlinkat",
        "readlink",
        "readlinkat",
        "rename",
        "renameat",
        "renameat2",
        "setxattr",
        "getxattr",
        "listxattr",
        "removexattr",
        "fsetxattr",
        "fgetxattr",
        "flistxattr",
        "fremovexattr",
        "name_to_handle_at",
        "open_by_handle_at",
        "ioctl$FITRIM",
        "ioctl$FS_IOC_FIEMAP",
        "ioctl$FS_IOC_GETFLAGS",
        "ioctl$FS_IOC_SETFLAGS",
        "ioctl$FS_IOC_GETFSLABEL",
        "ioctl$FS_IOC_SETFSLABEL",
        "splice",
        "sendfile",
        "syz_mount_image$__CODEX_ocfs2",
        "ioctl$__CODEX_OCFS2_IOC_*"
    ]
}
