{
    "kernel_subsystem": [
        {
            "name": "phonet",
            "path": [
                "net/phonet"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "filter": {
                    "files": [
                        "^net/phonet/"
                    ]
                },
                "name": "phonet",
                "weight": 10
            }
        ]
    },
    "enable_syscalls": [
        "socket$phonet",
        "socket$phonet_pipe",
        "bind$phonet",
        "connect$phonet_pipe",
        "accept$phonet_pipe",
        "accept4$phonet_pipe",
        "sendto$phonet",
        "recvfrom$phonet",
        "listen",
        "ioctl$SIOCPNADDRESOURCE",
        "ioctl$SIOCPNDELRESOURCE",
        "ioctl$SIOCPNENABLEPIPE",
        "ioctl$SIOCPNGETOBJECT",
        "setsockopt$PNPIPE_ENCAP",
        "getsockopt$PNPIPE_ENCAP",
        "setsockopt$PNPIPE_HANDLE",
        "getsockopt$PNPIPE_HANDLE",
        "setsockopt$PNPIPE_INITSTATE",
        "getsockopt$PNPIPE_INITSTATE",
        "getsockopt$PNPIPE_IFINDEX",
        "read",
        "write",
        "close",
        "socket$__CODEX_PHONET_*",
        "bind$__CODEX_PHONET",
        "connect$__CODEX_PHONET",
        "sendto$__CODEX_PHONET",
        "recvfrom$__CODEX_PHONET",
        "ioctl$__CODEX_SIOCPN*"
    ]
}
