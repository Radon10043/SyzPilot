{
    "kernel_subsystem": [
        {
            "name": "autofs",
            "path": [
                "fs/autofs"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "filter": {
                    "files": [
                        "^fs/autofs/"
                    ]
                },
                "name": "autofs",
                "weight": 10
            }
        ]
    },
    "enable_syscalls": [
        "mount",
        "openat$autofs",
        "open",
        "openat",
        "close",
        "read",
        "write",
        "stat",
        "lstat",
        "fstat",
        "mkdir",
        "mkdirat",
        "rmdir",
        "symlink",
        "symlinkat",
        "readlink",
        "readlinkat",
        "unlink",
        "unlinkat",
        "rename",
        "renameat",
        "renameat2",
        "getdents64",
        "ioctl$__CODEX_AUTOFS_IOC_*",
        "ioctl$__CODEX_AUTOFS_DEV_IOCTL_*"
    ]
}
