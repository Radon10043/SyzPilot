{
    "kernel_subsystem": [
        {
            "name": "sequencer",
            "path": [
                "sound/core/seq"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "filter": {
                    "files": [
                        "^sound/core/seq/"
                    ]
                },
                "name": "sequencer",
                "weight": 10
            }
        ]
    },
    "enable_syscalls": [
        "openat$sndseq",
        "write$sndseq",
        "read",
        "close",
        "poll",
        "openat$__CODEX_sndseq",
        "write$__CODEX_sndseq",
        "ioctl$__CODEX_SNDRV_SEQ_IOCTL_*"
    ]
}
