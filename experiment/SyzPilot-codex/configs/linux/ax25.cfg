{
    "kernel_subsystem": [
        {
            "name": "ax25",
            "path": [
                "net/ax25",
                "net/netrom",
                "net/rose"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "filter": {
                    "files": [
                        "^net/ax25/",
                        "^net/netrom/",
                        "^net/rose/"
                    ]
                },
                "name": "ax25",
                "weight": 10
            }
        ]
    },
    "enable_syscalls": [
        "syz_init_net_socket$ax25",
        "bind$ax25",
        "connect$ax25",
        "accept$ax25",
        "accept4$ax25",
        "sendto$ax25",
        "recvfrom$ax25",
        "getsockname$ax25",
        "getpeername$ax25",
        "getsockopt$ax25_int",
        "setsockopt$ax25_int",
        "setsockopt$ax25_SO_BINDTODEVICE",
        "ioctl$SIOCAX25ADDUID",
        "ioctl$SIOCAX25DELUID",
        "ioctl$SIOCAX25GETUID",
        "ioctl$SIOCAX25NOUID",
        "ioctl$SIOCAX25CTLCON",
        "ioctl$SIOCAX25GETINFO",
        "ioctl$SIOCAX25GETINFOOLD",
        "ioctl$SIOCAX25ADDFWD",
        "ioctl$SIOCAX25DELFWD",
        "ioctl$sock_ax25_SIOCADDRT",
        "ioctl$sock_ax25_SIOCDELRT",
        "ioctl$SIOCAX25OPTRT",
        "ioctl$SIOCNRDECOBS",
        "ioctl$SIOCRSGCAUSE",
        "ioctl$SIOCRSSCAUSE",
        "ioctl$SIOCRSSL2CALL",
        "ioctl$SIOCRSGL2CALL",
        "ioctl$SIOCRSACCEPT",
        "listen",
        "read",
        "write",
        "close",
        "socket$__CODEX_AX25_*",
        "bind$__CODEX_AX25",
        "connect$__CODEX_AX25",
        "sendto$__CODEX_AX25",
        "recvfrom$__CODEX_AX25",
        "setsockopt$__CODEX_AX25_*",
        "ioctl$__CODEX_SIOCAX25*"
    ]
}
