{
    "kernel_subsystem": [
        {
            "name": "comedi",
            "path": [
                "drivers/comedi"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "filter": {
                    "files": [
                        "^drivers/comedi/"
                    ]
                },
                "name": "comedi",
                "weight": 10
            }
        ]
    },
    "enable_syscalls": [
        "openat$comedi",
        "read",
        "write",
        "close",
        "mmap",
        "munmap",
        "syz_open_dev$__CODEX_comedi",
        "openat$__CODEX_comedi0",
        "ioctl$__CODEX_COMEDI_*"
    ]
}
