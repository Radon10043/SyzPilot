{
    "kernel_subsystem": [
        {
            "name": "dri",
            "path": [
                "drivers/gpu/drm"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "filter": {
                    "files": [
                        "^drivers/gpu/drm/"
                    ]
                },
                "name": "dri",
                "weight": 10
            }
        ]
    },
    "enable_syscalls": [
        "syz_open_dev$dri",
        "syz_open_dev$dricontrol",
        "syz_open_dev$drirender",
        "openat$drirender128",
        "read",
        "write",
        "close",
        "mmap",
        "munmap",
        "poll",
        "openat$__CODEX_dri_*",
        "ioctl$__CODEX_DRM_IOCTL_*"
    ]
}
