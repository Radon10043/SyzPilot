{
	"target": "linux/amd64",
	"http": "127.0.0.1:56741",
	"workdir": "__WORKDIR__",
	"kernel_obj": "__KERNEL__",
	"image": "__IMAGE__/bullseye.img",
	"sshkey": "__IMAGE__/bullseye.id_rsa",
	"syzkaller": "__SYZKALLER__",
	"procs": 8,
	"type": "qemu",
	"reproduce": false,
	"vm": {
		"count": __VMCOUNT__,
		"kernel": "__KERNEL__/arch/x86/boot/bzImage",
		"cpu": 2,
		"mem": 2048
	},
	"enable_syscalls": [
        "syz_mount_image$xfs",
		"ioctl$XFS_*",
        "mount",
        "umount2",
        "open",
        "openat",
        "creat",
        "close",
        "read",
        "pread64",
        "write",
        "pwrite64",
        "lseek",
        "fstat",
        "stat",
        "lstat",
        "ftruncate",
        "truncate",
        "fallocate",
        "fsync",
        "fdatasync",
        "chmod",
        "fchmod",
        "chown",
        "fchown",
        "lchown",
        "utime",
        "utimes",
        "rename",
        "renameat",
        "renameat2",
        "unlink",
        "unlinkat",
        "rmdir",
        "mkdir",
        "mkdirat",
        "link",
        "linkat",
        "symlink",
        "symlinkat",
        "readlink",
        "readlinkat",
        "quotactl"
    ]
}