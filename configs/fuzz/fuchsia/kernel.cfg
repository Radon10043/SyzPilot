{
	"name": "fuchsia",
	"target": "fuchsia/amd64",
	"http": ":12345",
	"workdir": "__WORKDIR__",
	"kernel_obj": "__FUCHSIA__/out/x64/syzkaller/obj",
	"kernel_src": "__FUCHSIA__/out/x64",
	"syzkaller": "__SYZKALLER__",
	"image": "__FUCHSIA__/out/x64/syzkaller/fxfs.blk",
	"sshkey": "__SSHKEY__",
	"reproduce": false,
	"cover": false,
	"procs": 8,
	"type": "qemu",
	"vm": {
		"count": __VMCOUNT__,
		"cpu": 2,
		"mem": 2048,
		"kernel": "__FUCHSIA__/out/x64/syzkaller/kernel",
		"initrd": "__FUCHSIA__/out/x64/syzkaller/fuchsia-ssh.zbi",
		"image_device": "drive if=none,format=raw,id=vdisk,cache=unsafe,file=",
		"network_device": "virtio-net-pci",
		"qemu_args": "-enable-kvm -machine q35,smbios-entry-point-type=32 -cpu host,migratable=off -object iothread,id=iothread0 -device virtio-blk-pci,drive=vdisk,iothread=iothread0"
	}
}
