{
	"name": "netbsd",
	"target": "netbsd/amd64",
	"http": ":10000",
	"workdir": "__WORKDIR__",
	"syzkaller": "__SYZKALLER__",
	"image": "__IMAGE__",
	"sshkey": "__SSHKEY__",
	"sandbox": "none",
	"procs": 2,
	"type": "qemu",
	"reproduce": false,
	"vm": {
		"count": __VMCOUNT__,
		"cpu": 2,
		"mem": 2048,
		"qemu_args": "-enable-kvm -cpu host,migratable=off -device intel-hda -device hda-duplex"
	}
}