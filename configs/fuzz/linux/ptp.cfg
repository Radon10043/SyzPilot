{
    "kernel_subsystem": [
        {
            "name": "ptp",
            "path": [
                "drivers/ptp"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "ptp",
                "filter": {
                    "files": [
                        "^drivers/ptp/"
                    ]
                },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "openat$ptp0",
        "openat$ptp1",
        "clock_adjtime$ptp_ptp_clock_ops",
        "clock_getres$ptp_ptp_clock_ops",
        "clock_gettime$ptp_ptp_clock_ops",
        "clock_settime$ptp_ptp_clock_ops",
        "ioctl$PTP_CLOCK_GETCAPS2_ptp_clock_ops",
        "ioctl$PTP_CLOCK_GETCAPS_ptp_clock_ops",
        "ioctl$PTP_ENABLE_PPS2_ptp_clock_ops",
        "ioctl$PTP_ENABLE_PPS_ptp_clock_ops",
        "ioctl$PTP_EXTTS_REQUEST2_ptp_clock_ops",
        "ioctl$PTP_EXTTS_REQUEST_ptp_clock_ops",
        "ioctl$PTP_MASK_CLEAR_ALL_ptp_clock_ops",
        "ioctl$PTP_MASK_EN_SINGLE_ptp_clock_ops",
        "ioctl$PTP_PEROUT_REQUEST2_ptp_clock_ops",
        "ioctl$PTP_PEROUT_REQUEST_ptp_clock_ops",
        "ioctl$PTP_PIN_GETFUNC2_ptp_clock_ops",
        "ioctl$PTP_PIN_GETFUNC_ptp_clock_ops",
        "ioctl$PTP_PIN_SETFUNC2_ptp_clock_ops",
        "ioctl$PTP_PIN_SETFUNC_ptp_clock_ops",
        "ioctl$PTP_SYS_OFFSET2_ptp_clock_ops",
        "ioctl$PTP_SYS_OFFSET_EXTENDED2_ptp_clock_ops",
        "ioctl$PTP_SYS_OFFSET_EXTENDED_ptp_clock_ops",
        "ioctl$PTP_SYS_OFFSET_PRECISE2_ptp_clock_ops",
        "ioctl$PTP_SYS_OFFSET_PRECISE_CYCLES_ptp_clock_ops",
        "ioctl$PTP_SYS_OFFSET_PRECISE_ptp_clock_ops",
        "ioctl$PTP_SYS_OFFSET_ptp_clock_ops",
        "mmap$vmclock_vmclock_miscdev_fops",
        "poll$ptp_ptp_clock_ops",
        "read$ptp_ptp_clock_ops",
        "read$vmclock_vmclock_miscdev_fops",
        "syz_open_dev$ptp_ptp_clock_ops",
        "syz_open_dev$vmclock_vmclock_miscdev_fops",
        "read$ptp",
        "close"
    ]
}
