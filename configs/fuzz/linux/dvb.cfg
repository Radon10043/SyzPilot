{
	"target": "linux/amd64",
	"http": "127.0.0.1:56741",
	"workdir": "__WORKDIR__",
	"kernel_obj": "__KERNEL__",
	"image": "__IMAGE__/bullseye.img",
	"sshkey": "__IMAGE__/bullseye.id_rsa",
	"syzkaller": "__SYZKALLER__",
	"procs": 8,
	"type": "qemu",
	"reproduce": false,
	"vm": {
		"count": __VMCOUNT__,
		"kernel": "__KERNEL__/arch/x86/boot/bzImage",
		"cpu": 2,
		"mem": 2048
	},
	"enable_syscalls": [
		"syz_open_dev$dvb_frontend",
		"ioctl$FE_*",
		"syz_open_dev$dvb_ca",
		"ioctl$CA_*",
		"syz_open_dev$dvb_demux",
		"ioctl$DMX_*",
		"syz_open_dev$dvb_dvr",
		"ioctl$DVB_DVR_*",
	]
}