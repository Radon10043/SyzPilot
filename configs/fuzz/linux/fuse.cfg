{
    "kernel_subsystem": [
        {
            "name": "fuse",
            "path": [
                "fs/fuse"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "fuse",
                "filter": {
                    "files": [
                        "^fs/fuse/"
                    ]
                },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "syz_mount_image$fuse",
        "syz_fuse_handle_req",
        "openat$fuse",
        "openat$cuse",
        "mount$fuse",
        "mount$fuseblk",
        "copy_file_range$fuse_fuse_file_operations",
        "fallocate$fuse_fuse_file_operations",
        "fdatasync$fuse_fuse_file_operations",
        "flock$fuse_fuse_file_operations",
        "fsync$fuse_fuse_file_operations",
        "ioctl$FUSE_DEV_IOC_BACKING_CLOSE_fuse_dev_operations",
        "ioctl$FUSE_DEV_IOC_BACKING_OPEN_fuse_dev_operations",
        "ioctl$FUSE_DEV_IOC_CLONE_cuse_frontend_fops",
        "ioctl$FUSE_DEV_IOC_CLONE_fuse_dev_operations",
        "ioctl$FUSE_DEV_IOC_SYNC_INIT_fuse_dev_operations",
        "ioctl$cuse_frontend_cuse_frontend_fops",
        "lseek$cuse_frontend_cuse_frontend_fops",
        "lseek$fuse_fuse_file_operations",
        "openat$cuse_cuse_frontend_fops",
        "openat$fuse_file_fuse_file_operations",
        "openat$fuse_fuse_dev_operations",
        "openat$fuse_fuse_file_operations",
        "poll$cuse_cuse_frontend_fops",
        "poll$fuse_fuse_dev_operations",
        "read$cuse_cuse_frontend_fops",
        "read$cuse_frontend_cuse_frontend_fops",
        "read$fuse_file_fuse_file_operations",
        "read$fuse_fuse_dev_operations",
        "read$fuse_fuse_file_operations",
        "syz_fuse_handle_req$fuse_file_operations",
        "syz_open_dev$cuse_frontend_cuse_frontend_fops",
        "write$cuse_cuse_frontend_fops",
        "write$cuse_frontend_cuse_frontend_fops",
        "write$fuse_fuse_dev_operations",
        "write$fuse_fuse_file_operations",
        "read$FUSE",
        "write$FUSE_*",
        "close"
    ]
}
