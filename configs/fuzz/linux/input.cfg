{
    "kernel_subsystem": [
        {
            "name": "input",
            "path": [
                "drivers/input"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "input",
                "filter": {
                    "files": [
                        "^drivers/input/"
                    ]
                },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "syz_open_dev$mouse",
        "syz_open_dev$evdev",
        "openat$mice",
        "openat$uinput",
        "ioctl$EVIOCGABS_evdev_fops",
        "ioctl$EVIOCGBIT_evdev_fops",
        "ioctl$EVIOCSABS_evdev_fops",
        "ioctl$JSIOCGAXES_joydev_fops",
        "ioctl$JSIOCGAXMAP_joydev_fops",
        "ioctl$JSIOCGBTNMAP_joydev_fops",
        "ioctl$JSIOCGBUTTONS_joydev_fops",
        "ioctl$JSIOCGCORR_joydev_fops",
        "ioctl$JSIOCGNAME_joydev_fops",
        "ioctl$JSIOCGVERSION_joydev_fops",
        "ioctl$JSIOCSAXMAP_joydev_fops",
        "ioctl$JSIOCSBTNMAP_joydev_fops",
        "ioctl$JSIOCSCORR_joydev_fops",
        "ioctl$JS_GET_ALL_joydev_fops",
        "ioctl$JS_GET_CAL_joydev_fops",
        "ioctl$JS_GET_TIMELIMIT_joydev_fops",
        "ioctl$JS_GET_TIMEOUT_joydev_fops",
        "ioctl$JS_SET_ALL_joydev_fops",
        "ioctl$JS_SET_TIMELIMIT_joydev_fops",
        "ioctl$JS_SET_TIMEOUT_joydev_fops",
        "ioctl$SPIOCSTYPE_serport_ldisc",
        "poll$joydev_joydev_fops",
        "read$joydev_joydev_fops",
        "read$serio_serport_ldisc",
        "syz_open_dev$joydev_joydev_fops",
        "syz_open_dev$serio_serport_ldisc",
        "write$serio_serport_ldisc",
        "write$uinput_uinput_fops",
        "write$evdev",
        "write$uinput_user_dev",
        "write$input_event",
        "ioctl$EVIOC*",
        "ioctl$UI_*",
        "read",
        "close",
        "poll"
    ]
}
