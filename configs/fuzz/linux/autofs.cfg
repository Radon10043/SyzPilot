{
    "kernel_subsystem": [
        {
            "name": "autofs",
            "path": [
                "fs/autofs"
            ]
        }
    ],
    "experimental": {
        "focus_areas": [
            {
                "name": "autofs",
                "filter": {
                    "files": [
                        "^fs/autofs/"
                    ]
                },
                "weight": 10.0
            }
        ]
    },
    "enable_syscalls": [
        "mount",
        "openat$autofs",
        "ioctl$AUTOFS_DEV_IOCTL_ASKUMOUNT__dev_ioctl_fops",
        "ioctl$AUTOFS_DEV_IOCTL_CATATONIC__dev_ioctl_fops",
        "ioctl$AUTOFS_DEV_IOCTL_CLOSEMOUNT__dev_ioctl_fops",
        "ioctl$AUTOFS_DEV_IOCTL_EXPIRE__dev_ioctl_fops",
        "ioctl$AUTOFS_DEV_IOCTL_FAIL__dev_ioctl_fops",
        "ioctl$AUTOFS_DEV_IOCTL_ISMOUNTPOINT__dev_ioctl_fops",
        "ioctl$AUTOFS_DEV_IOCTL_OPENMOUNT__dev_ioctl_fops",
        "ioctl$AUTOFS_DEV_IOCTL_PROTOSUBVER__dev_ioctl_fops",
        "ioctl$AUTOFS_DEV_IOCTL_PROTOVER__dev_ioctl_fops",
        "ioctl$AUTOFS_DEV_IOCTL_READY__dev_ioctl_fops",
        "ioctl$AUTOFS_DEV_IOCTL_REQUESTER__dev_ioctl_fops",
        "ioctl$AUTOFS_DEV_IOCTL_SETPIPEFD__dev_ioctl_fops",
        "ioctl$AUTOFS_DEV_IOCTL_TIMEOUT__dev_ioctl_fops",
        "ioctl$AUTOFS_DEV_IOCTL_VERSION__dev_ioctl_fops",
        "ioctl$AUTOFS_IOC_ASKUMOUNT_autofs_root_operations",
        "ioctl$AUTOFS_IOC_CATATONIC_autofs_root_operations",
        "ioctl$AUTOFS_IOC_EXPIRE_MULTI_autofs_root_operations",
        "ioctl$AUTOFS_IOC_EXPIRE_autofs_root_operations",
        "ioctl$AUTOFS_IOC_FAIL_autofs_root_operations",
        "ioctl$AUTOFS_IOC_PROTOSUBVER_autofs_root_operations",
        "ioctl$AUTOFS_IOC_PROTOVER_autofs_root_operations",
        "ioctl$AUTOFS_IOC_READY_autofs_root_operations",
        "ioctl$AUTOFS_IOC_SETTIMEOUT_autofs_root_operations",
        "open",
        "openat",
        "close",
        "read",
        "write",
        "stat",
        "lstat",
        "fstat",
        "mkdir",
        "mkdirat",
        "rmdir",
        "symlink",
        "symlinkat",
        "readlink",
        "readlinkat",
        "unlink",
        "unlinkat",
        "rename",
        "renameat",
        "renameat2",
        "getdents64"
    ]
}
